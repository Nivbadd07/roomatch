<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What's Around You?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: white;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .wave1 {
      position: fixed;
      width: 200%;
      height: 100%;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      background: white;
      opacity: 0.4;
      z-index: 1;
      animation: waveMove 12s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes waveMove {
      0% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-48%) translateY(10px); }
      100% { transform: translateX(-50%) translateY(0); }
    }
    .content {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-6 pb-28">
  <div class="wave1"></div>
  <div class="content max-w-md w-full px-6 text-center">
    <div class="flex justify-between items-center mb-2">
      <a href="apt-feed.html" class="text-[#764C8A] hover:text-[#764C8A] text-lg font-bold">← Back</a>
    </div>
    <h1 class="text-2xl font-semibold text-gray-900 mb-2">
      What's Around You?
    </h1>
    <p class="text-gray-500 mb-6">
      Discover places and services near your current location
    </p>
    <div class="mb-4 flex gap-2 justify-center">
      <input id="location-input" type="text" placeholder="Enter address or city..." class="w-2/3 border border-gray-300 px-4 py-2 rounded-full focus:outline-none focus:border-[#764C8A]" />
      <button id="search-btn" class="bg-[#764C8A] hover:bg-[#764C8A] text-white px-4 py-2 rounded-full font-semibold">Search</button>
      <button id="geo-btn" class="bg-[#764C8A] hover:bg-[#764C8A] text-white px-4 py-2 rounded-full font-semibold" title="Use my location">📍</button>
    </div>
    <div id="loading" class="hidden text-[#764C8A] font-semibold mt-6">Loading nearby places...</div>
    <div id="places-list" class="mt-6 text-left"></div>
  </div>
  <script>
    async function fetchPlaces(lat, lon) {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('places-list').innerHTML = '';
      // Use OpenStreetMap Nominatim to get nearby amenities
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
      const res = await fetch(url);
      const data = await res.json();
      // Use Overpass API to get nearby amenities
      const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json];node(around:1000,${lat},${lon})[amenity];out;`;
      const overRes = await fetch(overpassUrl);
      const overData = await overRes.json();
      const places = overData.elements.map(e => ({
        name: e.tags.name || e.tags.amenity,
        type: e.tags.amenity,
        lat: e.lat,
        lon: e.lon
      }));
      renderPlaces(places, data.display_name);
      document.getElementById('loading').classList.add('hidden');
    }

    function renderPlaces(places, address) {
      const list = document.getElementById('places-list');
      if (!places.length) {
        list.innerHTML = `<div class="text-center text-gray-500">😕 No places found nearby. Try another location or search again.</div>`;
        return;
      }
      list.innerHTML = `<div class="mb-2 text-[#764C8A] font-bold">Area: ${address}</div>` +
        places.slice(0, 12).map(p => `
          <div class="bg-white rounded-xl shadow p-3 mb-2 flex flex-col">
            <span class="font-semibold text-[#764C8A]">${p.name || p.type}</span>
            <span class="text-xs text-gray-500">${p.type}</span>
            <a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}" target="_blank" class="text-xs text-[#764C8A] hover:underline">View on map</a>
          </div>
        `).join('');
    }

    document.getElementById('search-btn').onclick = async function() {
      const query = document.getElementById('location-input').value.trim();
      if (!query) return;
      // Geocode the address
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.length) {
        fetchPlaces(data[0].lat, data[0].lon);
      } else {
        document.getElementById('places-list').innerHTML = '<div class="text-center text-gray-500">Location not found.</div>';
      }
    };

    document.getElementById('geo-btn').onclick = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          fetchPlaces(pos.coords.latitude, pos.coords.longitude);
        }, () => {
          alert('Could not get your location.');
        });
      } else {
        alert('Geolocation is not supported by your browser.');
      }
    };
  </script>
</body>
</html>

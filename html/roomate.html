<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discover Roommates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #fde2f3 0%, #e0d9ff 50%, #f3e8ff 100%);
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .wave1 {
      position: fixed;
      width: 200%;
      height: 100%;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23f8bbd0" fill-opacity="1" d="M0,32L40,37.3C80,43,160,53,240,80C320,107,400,149,480,165.3C560,181,640,171,720,165.3C800,160,880,160,960,170.7C1040,181,1120,203,1200,197.3C1280,192,1360,160,1400,144L1440,128L1440,0L1400,0C1360,0,1280,0,1200,0C1120,0,1040,0,960,0C880,0,800,0,720,0C640,0,560,0,480,0C400,0,320,0,240,0C160,0,80,0,40,0L0,0Z"></path></svg>') no-repeat center center;
      background-size: cover;
      opacity: 0.4;
      z-index: 1;
      animation: waveMove 12s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes waveMove {
      0% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-48%) translateY(10px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    .content {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 to-pink-100 scroll-smooth">

  <!-- גל ברקע -->
  <div class="wave1"></div>

  <!-- Main container -->
  <div class="max-w-2xl mx-auto pt-6 pb-36">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-2 text-sm text-purple-800">
        <i class="fas fa-map-marker-alt"></i>
        <a id="user-location" href="location.html" class="hover:underline cursor-pointer text-purple-800">Detecting location...</a>
      </div>
    </div>
    <h1 class="text-2xl font-bold text-center text-purple-900 mb-8">Discover Roommates</h1>
    <div id="roommate-feed" class="flex flex-col gap-14"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-md z-50">
    <div class="max-w-md mx-auto px-6 py-2 flex justify-between items-center text-center">
      <a href="roomate.html">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="#E48DCE" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 12.234V16L4.515 15.091L9.277 12.234H14C15.103 12.234 16 11.337 16 10.234V2.23401C16 1.13101 15.103 0.234009 14 0.234009H2C0.897 0.234009 0 1.13101 0 2.23401V10.234C0 11.337 0.897 12.234 2 12.234H3ZM2 2.23401H14V10.234H8.723L5 12.468V10.234H2V2.23401Z" />
        </svg>
      </a>
      <a href="apt-feed.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#541257" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-6H9v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
        </svg>
      </a>
      <a href="upload-apt.html">
        <svg width="50" height="50" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="14" fill="#A23BB1" />
          <path d="M14 8V20" stroke="white" stroke-width="2" stroke-linecap="round" />
          <path d="M8 14H20" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </a>
      <a href="onboarding.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E48DCE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M7 21v-2a4 4 0 0 1 3-3.87" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </a>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://vgkvkmpckneceqfggzes.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function getUserId() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return null;
      // Fetch the int8 user id from the users table using the auth_id (UUID)
      const { data: userRows } = await supabaseClient
        .from('users')
        .select('id')
        .eq('auth_id', user.id);
      return userRows && userRows.length > 0 ? userRows[0].id : null;
    }

    async function renderRoommates() {
      const container = document.getElementById('roommate-feed');
      container.innerHTML = '<div class="text-center text-gray-400 mt-10">Loading matches...</div>';
      const userId = await getUserId();
      if (!userId) {
        container.innerHTML = '<div class="text-center text-red-500 mt-10">User not logged in.</div>';
        return;
      }
      const res = await fetch(`https://roomatch-prod-1-109620478954.europe-west1.run.app/api/match/roommates/${userId}`);
      if (!res.ok) {
        container.innerHTML = '<div class="text-center text-red-500 mt-10">Failed to load matches.</div>';
        return;
      }
      const data = await res.json();
      const matches = data.results || [];
      console.log("matches from API:", matches);
      if (!matches.length) {
        container.innerHTML = '<div class="text-center text-gray-500 mt-10">No roommates found yet.</div>';
        return;
      }
      container.innerHTML = '';
      matches.forEach(({ roommate, score }, idx) => {
        const user = roommate;
        const placeholderUrl = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
        const imgUrl = user.profile_img || user.profile_image_url || placeholderUrl;
        // Main header: full_name (fallback to id)
        const mainHeader = user.full_name || user.id || 'Roommate';
        // Gender, age, interests
        const genderAge = [user.gender, user.age ? user.age + ' yrs' : null].filter(Boolean).join(' | ');
        const genderAgeHtml = genderAge ? `<div class='text-base text-gray-700 mb-1'>${genderAge}</div>` : '';
        const interestsHtml = (user.interests || []).map(i => `<span class='px-3 py-1 bg-pink-100 text-pink-800 rounded-full text-base font-medium mr-2 mb-2 inline-block'>${i}</span>`).join(' ');
        // Preferences as tags
        const prefs = user.preferences || {};
        const matchingPrefs = Object.entries(prefs)
          .filter(([k, v]) => v && v !== '' && v !== false && v !== 'false')
          .map(([k, v]) => `<span class='px-3 py-1 bg-purple-100 text-purple-800 rounded-full text-base font-medium mr-2 mb-2 inline-block'>${k.replace(/_/g, ' ')}: ${v}</span>`)
          .join(' ');
        // Bio
        const bioHtml = user.bio ? `<div class='mt-2'><div class='text-base font-semibold text-purple-900 mb-1'>Bio</div><div class='text-base text-gray-800'>${user.bio}</div></div>` : '';
        const card = document.createElement('div');
        card.className = 'relative max-w-2xl mx-auto my-8 p-0 rounded-3xl shadow-2xl overflow-hidden border-2 border-purple-300 bg-white bg-opacity-80';
        card.innerHTML = `
          <img src="${imgUrl}" alt="User photo" class="w-full h-80 object-cover rounded-t-3xl border-b-2 border-purple-200" loading="lazy" onerror="this.onerror=null;this.src='${placeholderUrl}';">
          <div class="px-8 pt-6 pb-4">
            <div class="text-2xl font-bold text-purple-900 mb-2">${mainHeader} <span class="ml-2 px-3 py-1 bg-purple-200 text-purple-900 rounded-full text-base font-semibold">${score !== undefined ? score + '% Match' : ''}</span></div>
            ${genderAgeHtml}
            <div class="flex flex-wrap gap-2 mb-3">${interestsHtml}</div>
            ${bioHtml}
            <div class="flex flex-wrap gap-2 mt-3">${matchingPrefs}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }
    renderRoommates();

    // Geolocation for location at the top
    function setLocationText(text) {
      document.getElementById('user-location').textContent = text;
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
          const data = await res.json();
          if (data.address && (data.address.city || data.address.town || data.address.village)) {
            setLocationText(data.address.city || data.address.town || data.address.village);
          } else if (data.display_name) {
            setLocationText(data.display_name.split(',')[0]);
          } else {
            setLocationText('Location found');
          }
        } catch {
          setLocationText('Location found');
        }
      }, () => setLocationText('Location unavailable'));
    } else {
      setLocationText('Location unavailable');
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Apartment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    body {
      background: white;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0;
      margin: 0;
    }

    .svg-bg {
      position: absolute;
      top: 40vh;
      left: 50vw;
      transform: translate(-50%, -50%) scale(1.2);
      z-index: 0;
      opacity: 0.10;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
      border-radius: 2rem;
      border: 1.5px solid rgba(162, 59, 177, 0.13);
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      max-width: 1000px;
      width: 100%;
      margin: 4rem auto 2rem auto;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 0.8s cubic-bezier(.4,1.7,.6,.97);
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .border-gradient-anim {
      pointer-events: none;
      border-radius: 2rem;
      background: linear-gradient(120deg, #fde2f3, #a23bb1 60%, #e0d9ff 100%);
      opacity: 0.5;
      filter: blur(10px);
      animation: borderAnim 6s linear infinite alternate;
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      z-index: 0;
    }

    @keyframes borderAnim {
      0% { opacity: 0.5; filter: blur(10px); }
      100% { opacity: 0.8; filter: blur(18px); }
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: bold;
      color: #2d1b4d;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 2;
    }

    .subtitle {
      color: #a23bb1;
      font-size: 1.1rem;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      margin-bottom: 2.2rem;
      z-index: 2;
    }

    .glass-select, .glass-input, textarea {
      background: #fff !important;
      position: relative;
      z-index: 1;
      border: 2px solid #a23bb1;
      border-radius: 1rem;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      color: #2d1b4d;
      margin-bottom: 0.7rem;
      width: 100%;
      box-shadow: 0 4px 12px rgba(162, 59, 177, 0.25);
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .glass-select:focus, .glass-input:focus, textarea:focus {
      border: 2px solid #541257;
      box-shadow: 0 0 0 3px rgba(162, 59, 177, 0.2), 0 4px 12px rgba(162, 59, 177, 0.3);
      background: white;
    }

    .glass-select::placeholder, .glass-input::placeholder, textarea::placeholder {
      color: #a23bb1;
      opacity: 0.8;
      font-weight: 500;
    }

    .feature-btn {
      background: rgba(255,255,255,0.7);
      border: 2px solid #a23bb1;
      color: #a23bb1;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.7rem 1.3rem;
      margin: 0.2rem 0.2rem 0.5rem 0.2rem;
      transition: all 0.2s cubic-bezier(.4,1.7,.6,.97);
      box-shadow: 0 2px 8px 0 rgba(162, 59, 177, 0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      outline: none;
      position: relative;
    }

    .feature-btn.active {
      background: linear-gradient(45deg, #a23bb1, #fde2f3);
      color: #fff !important;
      border-color: #a23bb1;
      box-shadow: 0 0 18px #a23bb1;
      animation: popSelected 0.4s cubic-bezier(.4,1.7,.6,.97);
    }

    .rooms button {
      background: rgba(255,255,255,0.7);
      border: 2px solid #a23bb1;
      color: #a23bb1;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.7rem 1.3rem;
      margin: 0.2rem;
      transition: all 0.2s cubic-bezier(.4,1.7,.6,.97);
      box-shadow: 0 2px 8px 0 rgba(162, 59, 177, 0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      outline: none;
      position: relative;
      min-width: 60px;
    }

    .rooms button.active {
      background: linear-gradient(45deg, #a23bb1, #fde2f3);
      color: #fff !important;
      border-color: #a23bb1;
      box-shadow: 0 0 18px #a23bb1;
      animation: popSelected 0.4s cubic-bezier(.4,1.7,.6,.97);
    }

    @keyframes popSelected {
      0% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 100%;
    }

    .photo-upload {
      width: 100%;
      aspect-ratio: 1/1.2;
      max-width: 110px;
      max-height: 140px;
      background: rgba(255,255,255,0.7);
      border: 2px solid #a23bb1;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(.4,1.7,.6,.97);
      box-shadow: 0 2px 8px 0 rgba(162, 59, 177, 0.06);
    }

    .photo-upload:hover {
      background: #f3e8ff;
      border-color: #541257;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(162, 59, 177, 0.3);
    }

    .photo-upload span {
      font-size: 2rem;
      color: #a23bb1;
      opacity: 0.7;
      pointer-events: none;
      transition: all 0.2s;
    }

    .photo-upload img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0.8rem;
      display: none;
    }

    .photo-upload input {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .submit-btn {
      background: linear-gradient(45deg, #a23bb1, #fde2f3);
      border: none;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(162, 59, 177, 0.13);
      transition: all 0.3s ease;
      font-size: 1.2rem;
      padding: 1.2rem 0;
      border-radius: 1.2rem;
      width: 100%;
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      outline: none;
    }

    .submit-btn:hover {
      background: linear-gradient(45deg, #fde2f3, #a23bb1);
      box-shadow: 0 0 30px rgba(162, 59, 177, 0.18);
      filter: brightness(1.08);
    }

    .submit-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 30px #a23bb1;
    }

    .submit-btn:focus {
      box-shadow: 0 0 0 3px #fde2f3, 0 0 20px #a23bb1;
    }

    .section-title {
      font-weight: bold;
      color: #000;
      font-size: 1.1rem;
      margin-bottom: 0.7rem;
      margin-top: 1.2rem;
      text-align: left;
      width: 100%;
    }

    .popup {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #4BB543, #45a33e);
      color: white;
      padding: 1.2rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.13);
      font-size: 1.1rem;
      font-weight: 600;
      display: none;
      z-index: 9999;
      text-align: center;
      letter-spacing: 0.5px;
      animation: fadeInUp 0.5s cubic-bezier(.4,1.7,.6,.97);
    }

    .back-link {
      color: #000;
      text-decoration: underline;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.5rem;
      transition: color 0.2s;
      z-index: 2;
    }

    .back-link:hover {
      color: #2d1b4d;
    }

    @media (max-width: 1200px) {
      .glass-card {
        max-width: 98vw;
      }
    }
    @media (max-width: 900px) {
      .flex.flex-wrap.gap-4.w-full.mb-4 {
        flex-direction: column !important;
      }
      .photo-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (max-width: 600px) {
      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center relative font-sans">
  <svg class="svg-bg" width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="200" cy="200" rx="180" ry="120" fill="#e0d9ff"/>
    <ellipse cx="120" cy="120" rx="60" ry="40" fill="#fde2f3"/>
    <ellipse cx="320" cy="280" rx="70" ry="50" fill="#a23bb1"/>
  </svg>

  <div class="glass-card">
    <div class="border-gradient-anim"></div>
    <div class="main-title">
      Upload Your Apartment <span style="font-size:1.2em;">🏠</span>
    </div>
    <div class="subtitle">
      Let's find you the perfect roommate!
    </div>

    <div class="flex flex-wrap gap-4 w-full mb-4" style="flex-direction: row;">
      <div style="flex:1; min-width: 180px;">
        <div class="section-title">City</div>
        <select id="city" class="glass-select">
          <option disabled selected value="">Select city</option>
          <option>Tel Aviv</option>
          <option>Jerusalem</option>
          <option>Haifa</option>
        </select>
      </div>
      <div style="flex:2; min-width: 220px;">
        <div class="section-title">Address</div>
        <input type="text" id="address" placeholder="Enter address" class="glass-input" />
      </div>
      <div style="flex:1; min-width: 180px;">
        <div class="section-title">Area</div>
        <select id="area" class="glass-select">
          <option disabled selected value="">Select area</option>
          <option>Center</option>
          <option>North</option>
          <option>South</option>
        </select>
      </div>
      <div style="flex:1; min-width: 180px;">
        <div class="section-title">Contract</div>
        <select id="contract" class="glass-select">
          <option disabled selected value="">Select contract type</option>
          <option>Long term</option>
          <option>Short term</option>
          <option>Sublet</option>
        </select>
      </div>
    </div>

    <div class="section-title">Features</div>
    <div class="flex flex-wrap justify-center gap-2">
      <button class="feature-btn">🏠 Balcony</button>
      <button class="feature-btn">🛗 Elevator</button>
      <button class="feature-btn">🛡 Mamad</button>
      <button class="feature-btn">📶 Wifi</button>
      <button class="feature-btn">🚗 Parking</button>
      <button class="feature-btn">📦 Storage</button>
      <button class="feature-btn">♿ Accessible</button>
    </div>

    <div class="section-title">Number of Rooms</div>
    <div class="rooms flex flex-wrap justify-center gap-2">
      <button>2</button>
      <button>2.5</button>
      <button>3</button>
      <button>4</button>
      <button>5</button>
    </div>

    <div class="flex flex-wrap gap-4 w-full mb-4" style="flex-direction: row;">
      <div style="flex:1; min-width: 220px;">
        <div class="section-title">Room Price</div>
        <input type="text" id="roomPrice" placeholder="Enter price" class="glass-input" />
      </div>
      <div style="flex:1; min-width: 220px;">
        <div class="section-title" style="font-size:1.15rem;">Date of Entry</div>
        <input type="date" id="dateOfEntry" class="glass-input" style="font-size:1.1rem;" />
      </div>
    </div>

    <div class="section-title">Tell us about the Apartment</div>
    <textarea placeholder="Describe the Apartment" class="glass-input"></textarea>

    <div class="section-title">Apartment Photos</div>
    <div class="photo-grid">
      <div class="photo-upload">
        <span>+</span>
        <input type="file" accept="image/*" onchange="previewImage(event, 0)">
        <img id="preview-0">
      </div>
      <div class="photo-upload">
        <span>+</span>
        <input type="file" accept="image/*" onchange="previewImage(event, 1)">
        <img id="preview-1">
      </div>
      <div class="photo-upload">
        <span>+</span>
        <input type="file" accept="image/*" onchange="previewImage(event, 2)">
        <img id="preview-2">
      </div>
      <div class="photo-upload">
        <span>+</span>
        <input type="file" accept="image/*" onchange="previewImage(event, 3)">
        <img id="preview-3">
      </div>
      <div class="photo-upload">
        <span>+</span>
        <input type="file" accept="image/*" onchange="previewImage(event, 4)">
        <img id="preview-4">
      </div>
      <div class="photo-upload">
        <span>+</span>
        <input type="file" accept="image/*" onchange="previewImage(event, 5)">
        <img id="preview-5">
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" type="button">
      <i class="fas fa-check"></i> Upload Apartment
    </button>

    <a href="apt-room.html" class="back-link">
      <span style="font-size:1.2em;">←</span> Back
    </a>
  </div>

  <div id="successPopup" class="popup">
    <span style="font-size:1.2em;">🎉</span><br>
    Your apartment was uploaded!<br>
    Now let's find you a roommate.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const SUPABASE_URL = 'https://vgkvkmpckneceqfggzes.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // GCP upload function for Apt_Pics
    async function uploadAptImageToGCP(file) {
      try {
        const timestamp = new Date().getTime();
        const filename = `Apt_Pics/${timestamp}_${file.name}`;
        const formData = new FormData();
        formData.append('file', file);
        formData.append('filename', filename);
        const response = await fetch('https://roomatch-prod-1-109620478954.europe-west1.run.app/api/upload-to-gcp', {
          method: 'POST',
          body: formData
        });
        if (!response.ok) throw new Error('Upload failed');
        const data = await response.json();
        return data.publicUrl;
      } catch (error) {
        console.error('Error uploading to GCP:', error);
        throw error;
      }
    }

    // --- Data Service Abstraction ---
    async function getApartments() {
      return JSON.parse(localStorage.getItem('apartments') || '[]');
    }
    async function saveApartments(apartments) {
      localStorage.setItem('apartments', JSON.stringify(apartments));
    }
    async function getRoommateSeekers() {
      return JSON.parse(localStorage.getItem('roommate_seekers') || '[]');
    }
    async function saveRoommateSeekers(seekers) {
      localStorage.setItem('roommate_seekers', JSON.stringify(seekers));
    }
    async function getUserApartment() {
      return JSON.parse(localStorage.getItem('user_apartment') || 'null');
    }
    async function saveUserApartment(apt) {
      localStorage.setItem('user_apartment', JSON.stringify(apt));
    }
    // --- End Data Service ---

    // Feature toggle multi-select
    document.querySelectorAll('.feature-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
      });
    });

    // Room button toggle - single select
    document.querySelectorAll('.rooms button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.rooms button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Room price integer-only input
    document.getElementById('roomPrice').addEventListener('input', function () {
      this.value = this.value.replace(/[^\d]/g, '');
    });

    // Image preview
    function previewImage(event, index) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('preview-' + index);
          img.src = e.target.result;
          img.style.display = "block";
          event.target.previousElementSibling.style.display = "none"; // hides "+"
        };
        reader.readAsDataURL(file);
      }
    }

    // Collect selected files for upload
    function getSelectedAptFiles() {
      const files = [];
      document.querySelectorAll('.photo-upload input[type="file"]').forEach(input => {
        if (input.files && input.files[0]) {
          files.push(input.files[0]);
        }
      });
      return files;
    }

    // ✅ Show popup on submit with validation
    document.getElementById('submitBtn').addEventListener('click', async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Uploading...';

      try {
        // Validate city
        const city = document.getElementById('city').value;
        if (!city) throw new Error('Please select a city.');
        // Validate address
        const address = document.getElementById('address').value.trim();
        if (!address) throw new Error('Please enter an address.');
        // Validate area
        const area = document.getElementById('area').value;
        if (!area) throw new Error('Please select an area.');
        // Validate contract
        const contract = document.getElementById('contract').value;
        if (!contract) throw new Error('Please select a contract type.');
        // Validate at least one feature
        const features = document.querySelectorAll('.feature-btn.active');
        if (features.length === 0) throw new Error('Please select at least one feature.');
        // Validate room selection
        const rooms = document.querySelectorAll('.rooms button.active');
        if (rooms.length === 0) throw new Error('Please select the number of rooms.');
        // Validate price
        const price = document.getElementById('roomPrice').value.trim();
        if (!price || isNaN(price) || Number(price) <= 0) throw new Error('Please enter a valid room price.');
        // Validate furniture description
        const furniture = document.querySelector('textarea').value.trim();
        if (!furniture) throw new Error('Please describe the furniture.');
        // Validate date
        const date = document.getElementById('dateOfEntry').value;
        if (!date) throw new Error('Please select a date of entry.');

        // Upload all selected images to GCP
        const aptFiles = getSelectedAptFiles();
        let imageUrls = [];
        if (aptFiles.length > 0) {
          // Optionally show a progress bar or spinner here
          for (let i = 0; i < aptFiles.length; i++) {
            try {
              imageUrls.push(await uploadAptImageToGCP(aptFiles[i]));
            } catch (err) {
              alert('Failed to upload image #' + (i+1) + ': ' + err.message);
              // Optionally: break or continue
            }
          }
        }
        if (imageUrls.length === 0) {
          throw new Error('Please upload at least one apartment photo.');
        }

        // Get user id for roommate_id
        const userId = parseInt(localStorage.getItem('user_id'));
        if (!userId) throw new Error('User not found. Please log in again.');

        function stripEmojis(str) {
          return str.replace(/^[^a-zA-Z0-9]+/, '').trim();
        }
        const featuresArray = Array.from(features).map(f => stripEmojis(f.textContent.trim()));
        const { error } = await supabaseClient
          .from('apartments')
          .insert([{
            address: address,
            city: city,
            area: area,
            contract_type: contract,
            features: featuresArray,
            num_rooms: parseFloat(rooms[0].textContent.trim()),
            price_per_month: parseInt(price),
            description: furniture,
            date_of_entry: date,
            image_urls: imageUrls,
            roommate_id: [userId]
          }]);
        if (error) throw new Error(error.message);

        // Show success popup and redirect
        const popup = document.getElementById('successPopup');
        popup.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'roomate.html';
        }, 2000);

      } catch (err) {
        alert(err.message || 'Something went wrong');
      } finally {
        btn.disabled = false;
        btn.textContent = "I'm done";
      }
    });

    // Set default and min date for calendar
    const dateInput = document.getElementById('dateOfEntry');
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
    dateInput.min = today;
  </script>

</body>
</html>

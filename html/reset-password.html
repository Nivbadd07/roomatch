<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RooMatch - Reset Password</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #F2F4F5; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Rubik', sans-serif; overflow-x: hidden; }
    .spinner { border: 4px solid #e5e7eb; border-top: 4px solid #764C8A; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      body { display: block; align-items: flex-start; justify-content: flex-start; min-height: 100vh; overflow-y: auto; }
    }
  </style>
</head>
<body class="overflow-y-auto">
  <div class="flex flex-col items-center justify-center w-full max-w-md p-8 bg-white rounded-xl shadow-lg">
    <div class="flex items-center mb-4">
      <img src="https://storage.googleapis.com/roomatch-prod-static-site/logo.png" alt="RooMatch Logo" class="w-10 h-10 mr-2" onerror="this.style.display='none'"/>
      <span class="text-3xl font-extrabold text-purple-700 tracking-tight">RooMatch</span>
    </div>
    <h2 class="text-2xl font-bold mb-2 text-gray-900">Reset Your Password</h2>
    <form id="resetForm" class="w-full mt-4">
      <div class="mb-4">
        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
        <input type="password" id="newPassword" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-50 placeholder-gray-400" placeholder="Enter new password" minlength="6" required />
      </div>
      <div class="mb-4">
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-50 placeholder-gray-400" placeholder="Confirm new password" minlength="6" required />
      </div>
      <div id="resetError" class="text-red-600 text-sm mb-2 hidden"></div>
      <div id="resetSuccess" class="text-green-600 text-sm mb-2 hidden"></div>
      <button type="submit" id="resetBtn" class="w-full bg-purple-700 text-white py-3 rounded-lg font-semibold flex items-center justify-center gap-2">
        <span id="resetBtnText">Reset Password</span>
        <span id="resetSpinner" class="spinner hidden"></span>
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      'https://vgkvkmpckneceqfggzes.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU'
    );
    const resetForm = document.getElementById('resetForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const resetError = document.getElementById('resetError');
    const resetSuccess = document.getElementById('resetSuccess');
    const resetBtn = document.getElementById('resetBtn');
    const resetBtnText = document.getElementById('resetBtnText');
    const resetSpinner = document.getElementById('resetSpinner');

    function showError(msg) {
      resetError.textContent = msg;
      resetError.classList.remove('hidden');
    }
    function hideError() {
      resetError.textContent = '';
      resetError.classList.add('hidden');
    }
    function showSuccess(msg) {
      resetSuccess.textContent = msg;
      resetSuccess.classList.remove('hidden');
    }
    function hideSuccess() {
      resetSuccess.textContent = '';
      resetSuccess.classList.add('hidden');
    }
    function setLoading(isLoading) {
      if (isLoading) {
        resetBtnText.classList.add('hidden');
        resetSpinner.classList.remove('hidden');
        resetBtn.disabled = true;
      } else {
        resetBtnText.classList.remove('hidden');
        resetSpinner.classList.add('hidden');
        resetBtn.disabled = false;
      }
    }

    resetForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideError();
      hideSuccess();
      setLoading(true);
      const password = newPassword.value.trim();
      const confirm = confirmPassword.value.trim();
      if (password.length < 6) {
        showError('Password must be at least 6 characters long.');
        setLoading(false);
        return;
      }
      if (password !== confirm) {
        showError('Passwords do not match.');
        setLoading(false);
        return;
      }
      try {
        const { data, error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;
        showSuccess('Password reset successful! You can now log in with your new password.');
        newPassword.value = '';
        confirmPassword.value = '';
      } catch (error) {
        showError('Failed to reset password. The link may be invalid or expired.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>

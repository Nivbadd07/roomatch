<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOMATCH - Apartment Feed</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      background: #F2F4F5;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      font-family: 'Rubik', sans-serif;
    }

    .content {
      position: relative;
      z-index: 10;
    }
  </style>
</head>

<body class="min-h-screen scroll-smooth overflow-y-auto">

  <!-- Main container -->
  <div class="pt-6 pb-36 w-full" style="position:relative;z-index:10;">
    <div class="flex justify-between items-center mb-6 w-full px-8">
      <div class="flex items-center gap-2 text-sm text-purple-800">
        <i class="fas fa-map-marker-alt" style="font-size: 2.2em;"></i>
        <a id="user-location" href="location.html" class="hover:underline cursor-pointer text-purple-800">Detecting location...</a>
      </div>
    </div>
    <h1 class="text-4xl font-bold text-center text-purple-900 mb-8">Discover apartments</h1>
    <div id="subheadline" class="text-xl text-center text-purple-700 mb-8">Loading...</div>
    <div id="apartment-feed" class="grid gap-8 w-full px-4 mx-auto"
      style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); max-width: 1400px;"></div>
  </div>

  <!-- Schedule Tour Modal -->
  <div id="scheduleModal" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-6 shadow-lg w-80 relative">
      <button id="closeModal" class="absolute top-2 right-2 text-gray-400 hover:text-purple-700 text-xl">&times;</button>
      <div class="font-bold text-lg mb-2">Schedule a Tour</div>
      <label class="block mb-2 text-sm font-medium">Pick a date and time:</label>
      <input id="tourDateTime" type="datetime-local" class="w-full border border-purple-200 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-300" />
      <button id="addToGoogleCal" class="w-full bg-purple-800 hover:bg-purple-900 text-white py-2 rounded-lg font-semibold">Add to Google Calendar</button>
    </div>
  </div>

  <!-- Add Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-6 shadow-lg w-80 relative">
      <div class="font-bold text-lg mb-4 text-center">Confirm Switch</div>
      <div class="text-gray-600 mb-6 text-center">Are you sure you want to start looking for Roommates?</div>
      <div class="flex gap-3">
        <button id="confirmCancel" class="flex-1 border border-purple-200 text-purple-800 py-2 rounded-lg font-semibold hover:bg-purple-50">Cancel</button>
        <button id="confirmOk" class="flex-1 bg-purple-800 hover:bg-purple-900 text-white py-2 rounded-lg font-semibold">OK</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-md z-50">
    <div class="w-full px-8 py-4 flex justify-between items-center text-center" style="height: 80px;">
      <div class="flex gap-x-20 mx-auto items-center">
        <a href="chat-amit.html">
          <svg width="32" height="32" viewBox="0 0 16 16" fill="#E48DCE" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12.234V16L4.515 15.091L9.277 12.234H14C15.103 12.234 16 11.337 16 10.234V2.23401C16 1.13101 15.103 0.234009 14 0.234009H2C0.897 0.234009 0 1.13101 0 2.23401V10.234C0 11.337 0.897 12.234 2 12.234H3ZM2 2.23401H14V10.234H8.723L5 12.468V10.234H2V2.23401Z" />
          </svg>
        </a>
        <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#541257" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-6H9v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
          </svg>
        </a>
        <a href="#" onclick="handleFeedToggle(event)">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#E48DCE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M7 21v-2a4 4 0 0 1 3-3.87"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
        <a href="settings.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#E48DCE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1-2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
      </div>
      <a href="#" onclick="handleLogout(event)">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#E48DCE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </a>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://vgkvkmpckneceqfggzes.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function getUserId() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return null;
      // Fetch the int8 user id from the users table using the auth_id (UUID)
      const { data: userRows } = await supabaseClient
        .from('users')
        .select('id')
        .eq('auth_id', user.id);
      return userRows && userRows.length > 0 ? userRows[0].id : null;
    }

    async function renderApartments() {
      const container = document.getElementById('apartment-feed');
      const subheadline = document.getElementById('subheadline');
      container.innerHTML = '<div class="text-center text-gray-400 mt-10">Loading matches...</div>';
      const userId = await getUserId();
      if (!userId) {
        container.innerHTML = '<div class="text-center text-red-500 mt-10">User not logged in.</div>';
        subheadline.innerHTML = 'Please log in to continue';
        return;
      }
      
      // Fetch user's full name
      const { data: userData } = await supabaseClient
        .from('users')
        .select('full_name')
        .eq('id', userId)
        .single();
      
      if (userData && userData.full_name) {
        const firstName = userData.full_name.split(' ')[0];
        subheadline.innerHTML = `Hey ${firstName}, Let's Find you an Apartment`;
      } else {
        subheadline.innerHTML = "Let's Find you an Apartment";
      }

      const res = await fetch(`https://roomatch-prod-1-109620478954.europe-west1.run.app/api/match/apartments/${userId}`);
      if (!res.ok) {
        container.innerHTML = '<div class="text-center text-red-500 mt-10">Failed to load matches.</div>';
        return;
      }
      const { results = [] } = await res.json();
      if (!results.length) {
        container.innerHTML = '<div class="text-center text-gray-500 mt-10">No matched apartments found.</div>';
        return;
      }
      container.innerHTML = '';
      window._aptResults = results; // Store globally for modal use
      results.forEach((match, idx) => {
        const apartment = match.apartment;
        const score = match.match_score;
        const placeholderUrl = "https://dummyimage.com/600x400/cccccc/ffffff&text=No+Image";
        let imgUrl = placeholderUrl;
        if (Array.isArray(apartment.image_urls) && apartment.image_urls.length > 0) {
          const firstUrl = apartment.image_urls[0];
          if (typeof firstUrl === 'string' && firstUrl.trim() !== '') {
            imgUrl = firstUrl;
          }
        }
        const featuresHtml = (apartment.features || []).map(f => `<span class='px-3 py-1' style='background:#fde2f3;color:#764C8A;border-radius:1rem;'>${f}</span>`).join(' ');
        const entryDate = apartment.date_of_entry ? new Date(apartment.date_of_entry).toLocaleDateString() : '';
        const address = apartment.address ? `<div class='text-base text-gray-500 mb-1'><i class='fas fa-map-marker-alt'></i> ${apartment.address}</div>` : '';
        
        // Display match score from backend
        const matchPercent = typeof score === 'number' ? Math.round(score) : 50;
        const matchHtml = `<div style='position:absolute;top:18px;right:18px;z-index:2;'><span style='background:#fde2f3;color:#764C8A;font-weight:700;padding:0.5em 1em;border-radius:1.2em;font-size:1.1em;'>${matchPercent}% Match</span></div>`;
        const card = document.createElement('div');
        card.className = 'relative w-full min-h-[400px] h-full flex flex-col rounded-3xl shadow-2xl overflow-hidden border-2 cursor-pointer';
        card.style.borderColor = '#764C8A';
        card.style.background = 'white';
        card.innerHTML = `
          ${matchHtml}
          <img src="${imgUrl}" alt="Apartment photo" class="w-full aspect-[4/3] object-cover rounded-t-3xl border-b-2" style="border-color:#764C8A;" loading="lazy" onerror="this.onerror=null;this.src='${placeholderUrl}';">
          <div class="px-10 pt-8 pb-8 flex flex-col flex-1 h-full">
            <div class="flex-1 flex flex-col">
              <div class="text-2xl font-bold" style="color:#764C8A; margin-bottom:0.5em; display:flex;align-items:center;gap:0.5em;">
                ${apartment.price_per_month ? '<span class="font-bold">₪' + apartment.price_per_month + '</span>' : ''} <span class="font-normal text-gray-500 text-xl">/ mo</span>
              </div>
              <div class="text-lg text-gray-700 mb-1">
                <strong>${apartment.city ? `<a href='location.html' class='text-purple-800 hover:underline cursor-pointer'>${apartment.city}</a>` : ''}</strong>
                ${apartment.area ? ', ' + apartment.area : ''}
              </div>
              ${address}
              <div class="flex flex-wrap gap-3 mb-3">
                ${featuresHtml}
              </div>
              <div class="text-base text-gray-600 mb-2">
                ${apartment.contract_type ? '<i class=\'fas fa-file-signature\'></i> ' + apartment.contract_type + ' | ' : ''}
                ${apartment.num_rooms ? '<i class=\'fas fa-door-open\'></i> ' + apartment.num_rooms + ' rooms | ' : ''}
                ${entryDate ? '<i class=\'fas fa-calendar-alt\'></i> Entry: ' + entryDate : ''}
              </div>
              ${apartment.description ? `<div class='text-base text-gray-700 mb-3'>${apartment.description}</div>` : ''}
            </div>
            <div class="mt-auto flex flex-col gap-2">
              <button class="w-full bg-[#764C8A] hover:bg-[#5e3c6e] text-white py-3 rounded-xl text-lg font-semibold shadow schedule-tour-btn" data-apt="${idx}" type="button">
                <i class=\"fa-solid fa-calendar-check mr-1\"></i> Schedule Tour
              </button>
              <a href="chat-amit.html?return=" + encodeURIComponent(window.location.pathname) + "" class="w-full flex justify-center items-center border" style="border-color:#764C8A;color:#764C8A;background:#fde2f3;hover:bg-purple-50;py-3;border-radius:1em;font-size:1.1em;font-weight:600;">
                <i class="fa-regular fa-comment-dots mr-2"></i> Chat
              </a>
            </div>
          </div>
        `;
        card.addEventListener('click', function(e) {
          // Only go to details if not clicking the schedule button
          if (e.target.classList.contains('schedule-tour-btn')) {
            selectedAptIdx = idx;
            scheduleModal.classList.remove('hidden');
            return;
          }
          if (!e.target.classList.contains('schedule-tour-btn')) {
            window.location.href = `apt-details.html?id=${apartment.id}`;
          }
        });
        container.appendChild(card);
      });
    }
    renderApartments();

    // Geolocation for location at the top
    function setLocationText(text) {
      const locationLink = document.getElementById('user-location');
      locationLink.textContent = text;
      locationLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(text)}`;
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
          const data = await res.json();
          if (data.address && (data.address.city || data.address.town || data.address.village)) {
            setLocationText(data.address.city || data.address.town || data.address.village);
          } else if (data.display_name) {
            setLocationText(data.display_name.split(',')[0]);
          } else {
            setLocationText('Location found');
          }
        } catch {
          setLocationText('Location found');
        }
      }, () => setLocationText('Location unavailable'));
    } else {
      setLocationText('Location unavailable');
    }

    // Schedule Tour Modal logic (dynamic)
    let selectedAptIdx = null;
    const scheduleModal = document.getElementById('scheduleModal');
    const closeModal = document.getElementById('closeModal');
    const addToGoogleCal = document.getElementById('addToGoogleCal');
    const tourDateTime = document.getElementById('tourDateTime');

    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('schedule-tour-btn')) {
        selectedAptIdx = e.target.getAttribute('data-apt');
        scheduleModal.classList.remove('hidden');
      }
    });
    closeModal.addEventListener('click', () => {
      scheduleModal.classList.add('hidden');
    });
    scheduleModal.addEventListener('click', (e) => {
      if (e.target === scheduleModal) scheduleModal.classList.add('hidden');
    });
    addToGoogleCal.addEventListener('click', () => {
      const dt = tourDateTime.value;
      if (!dt) {
        alert('Please select a date and time.');
        return;
      }
      let apt;
      if (selectedAptIdx === 'user') {
        // User's own apartment
        apt = JSON.parse(localStorage.getItem('user_apartment') || 'null');
        if (!apt) {
          alert('No apartment data found.');
          return;
        }
        apt.address = (apt.city ? apt.city : '') + (apt.area ? ', ' + apt.area : '');
        apt.roommate = '';
      } else {
        apt = window._aptResults && window._aptResults[selectedAptIdx] ? window._aptResults[selectedAptIdx].apartment : null;
      }
      if (!apt) {
        alert('No apartment data found.');
        return;
      }
      // Format date/time for Google Calendar (YYYYMMDDTHHMMSSZ)
      const start = new Date(dt);
      const end = new Date(start.getTime() + 60 * 60 * 1000); // 1 hour meeting
      function toGCalFormat(date) {
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      }
      const startStr = toGCalFormat(start);
      const endStr = toGCalFormat(end);
      
      // Enhanced apartment tour details
      const title = encodeURIComponent(`Apartment Tour: ${apt.address || 'New Apartment'}`);
      const details = encodeURIComponent(
        `Apartment Details:\n` +
        `Address: ${apt.address || 'N/A'}\n` +
        `Price: $${apt.price_per_month || 'N/A'} / month\n` +
        `Rooms: ${apt.num_rooms || 'N/A'}\n` +
        `Contract Type: ${apt.contract_type || 'N/A'}\n` +
        `Features: ${(apt.features || []).join(', ') || 'N/A'}\n` +
        `Entry Date: ${apt.date_of_entry ? new Date(apt.date_of_entry).toLocaleDateString() : 'N/A'}\n` +
        `Description: ${apt.description || 'N/A'}`
      );
      const location = encodeURIComponent(apt.address || '');
      
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startStr}/${endStr}&details=${details}&location=${location}`;
      window.open(url, '_blank');
      scheduleModal.classList.add('hidden');
      // TODO: Send email notification here (future implementation)
    });

    // Add logout handler
    async function handleLogout(event) {
      event.preventDefault();
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    // Initialize modal handlers
    document.addEventListener('DOMContentLoaded', function() {
      const confirmModal = document.getElementById('confirmModal');
      const confirmOk = document.getElementById('confirmOk');
      const confirmCancel = document.getElementById('confirmCancel');

      // Handle cancellation
      confirmCancel.addEventListener('click', () => {
        confirmModal.classList.add('hidden');
      });

      // Close modal when clicking outside
      confirmModal.addEventListener('click', (e) => {
        if (e.target === confirmModal) {
          confirmModal.classList.add('hidden');
        }
      });
    });

    async function handleFeedToggle(event) {
      event.preventDefault();
      const userId = await getUserId();
      if (!userId) {
        alert('Please log in to continue');
        return;
      }

      // Show confirmation modal
      const confirmModal = document.getElementById('confirmModal');
      const confirmOk = document.getElementById('confirmOk');

      // Set up the confirmation handler
      confirmOk.onclick = async () => {
        try {
          // Update user_type in the database
          const { error } = await supabaseClient
            .from('users')
            .update({ user_type: 'Looking for Roommate' })
            .eq('id', userId);

          if (error) throw error;

          // Redirect to roommate page
          window.location.href = 'roomate.html';
        } catch (error) {
          console.error('Error updating user type:', error);
          alert('Failed to update preferences. Please try again.');
        }
      };

      // Show the modal
      confirmModal.classList.remove('hidden');
    }
  </script>

</body>
</html>

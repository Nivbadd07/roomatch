<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOMATCH - Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: white;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .content {
      position: relative;
      z-index: 10;
    }

    .glass-card {
      background: white;
      box-shadow: 0 8px 40px 0 rgba(162, 59, 177, 0.13), 0 2px 8px 0 rgba(31, 38, 135, 0.08);
      border: 2.5px solid rgba(162, 59, 177, 0.10);
      border-radius: 2rem;
      overflow: hidden;
      max-width: 650px;
      width: 98vw;
      padding: 1rem 1.2rem;
      box-sizing: border-box;
      position: relative;
    }

    .border-gradient {
      position: relative;
      z-index: 1;
    }
    .border-gradient-anim {
      pointer-events: none;
      border-radius: 1.25rem;
      background: linear-gradient(120deg, #fde2f3, #a23bb1 60%, #e0d9ff 100%);
      opacity: 0.5;
      filter: blur(8px);
      animation: borderAnim 6s linear infinite alternate;
    }
    @keyframes borderAnim {
      0% { opacity: 0.5; filter: blur(8px); }
      100% { opacity: 0.8; filter: blur(16px); }
    }
    @media (max-width: 1100px) {
      .glass-card {
        max-width: 99vw;
        width: 98vw;
        padding: 0.7rem 0.3rem 0.7rem 0.3rem;
        margin: 2vw auto;
      }
    }
    @media (min-width: 900px) {
      .glass-card {
        max-width: 650px;
        width: 98vw;
        padding: 1.2rem 1.5rem 1.2rem 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="content max-w-2xl w-full px-8 text-center relative mx-auto">
    <!-- Colorful SVG background shapes -->
    <svg class="absolute left-[-120px] top-[-80px] z-0" width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" style="opacity:0.25;">
      <ellipse cx="200" cy="200" rx="180" ry="120" fill="#e0d9ff"/>
      <ellipse cx="120" cy="120" rx="60" ry="40" fill="#fde2f3"/>
      <ellipse cx="320" cy="280" rx="70" ry="50" fill="#a23bb1"/>
    </svg>
    <div class="relative rounded-xl shadow-2xl py-16 px-12 flex flex-col items-center glass-card border-gradient" style="background: rgba(255,255,255,0.85);">
      <!-- Animated Gradient Border -->
      <div class="absolute -inset-1 rounded-2xl z-0 border-gradient-anim"></div>
      <!-- Decorative Image with glow -->
      <div class="mb-10 z-10 relative">
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 rounded-full bg-gradient-to-br from-pink-200 via-purple-200 to-purple-100 blur-2xl opacity-60 animate-pulse"></div>
        <div class="relative z-10 w-32 h-32 mx-auto">
          <!-- Modern SVG Illustration -->
          <svg viewBox="0 0 400 400" class="w-full h-full">
            <!-- Background Elements -->
            <defs>
              <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a23bb1;stop-opacity:0.2"/>
                <stop offset="100%" style="stop-color:#fde2f3;stop-opacity:0.1"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <!-- Modern Apartment Building -->
            <g transform="translate(60, 100)">
              <!-- Building Structure -->
              <rect x="0" y="0" width="280" height="220" rx="20" fill="url(#buildingGradient)"/>
              <!-- Windows Grid -->
              <g fill="#fde2f3">
                <!-- First Floor -->
                <rect x="30" y="30" width="40" height="40" rx="8"/>
                <rect x="90" y="30" width="40" height="40" rx="8"/>
                <rect x="150" y="30" width="40" height="40" rx="8"/>
                <rect x="210" y="30" width="40" height="40" rx="8"/>
                <!-- Second Floor -->
                <rect x="30" y="90" width="40" height="40" rx="8"/>
                <rect x="90" y="90" width="40" height="40" rx="8"/>
                <rect x="150" y="90" width="40" height="40" rx="8"/>
                <rect x="210" y="90" width="40" height="40" rx="8"/>
              </g>
              <!-- Door -->
              <rect x="120" y="150" width="40" height="70" rx="8" fill="#e0d9ff"/>
              <circle cx="150" cy="185" r="3" fill="#a23bb1"/>
            </g>

            <!-- Roommate Profiles with Details -->
            <g transform="translate(80, 60)">
              <!-- Profile 1 -->
              <circle cx="0" cy="0" r="30" fill="#a23bb1"/>
              <circle cx="0" cy="-8" r="12" fill="#fde2f3"/>
              <path d="M-15 15 Q 0 35 15 15" stroke="#fde2f3" stroke-width="4" fill="none"/>
              <!-- Profile Icon -->
              <g transform="translate(-20, -20)">
                <rect x="0" y="0" width="40" height="40" rx="8" fill="#a23bb1" opacity="0.2"/>
                <text x="20" y="25" text-anchor="middle" fill="#a23bb1" font-size="24">👥</text>
              </g>
            </g>

            <g transform="translate(320, 60)">
              <!-- Profile 2 -->
              <circle cx="0" cy="0" r="30" fill="#a23bb1"/>
              <circle cx="0" cy="-8" r="12" fill="#fde2f3"/>
              <path d="M-15 15 Q 0 35 15 15" stroke="#fde2f3" stroke-width="4" fill="none"/>
              <!-- Apartment Icon -->
              <g transform="translate(-20, -20)">
                <rect x="0" y="0" width="40" height="40" rx="8" fill="#a23bb1" opacity="0.2"/>
                <text x="20" y="25" text-anchor="middle" fill="#a23bb1" font-size="24">🏠</text>
              </g>
            </g>

            <!-- Connection Elements -->
            <g filter="url(#glow)">
              <!-- Connection Line -->
              <path d="M110 60 Q 200 20 290 60" stroke="#a23bb1" stroke-width="4" fill="none" stroke-dasharray="8,8"/>
              <!-- Heart Center -->
              <circle cx="200" cy="20" r="20" fill="#e0d9ff"/>
              <text x="200" y="30" text-anchor="middle" fill="#a23bb1" font-size="24" font-weight="bold">♥</text>
            </g>

            <!-- Decorative Elements -->
            <g opacity="0.6">
              <!-- Floating Elements -->
              <circle cx="40" cy="40" r="10" fill="#fde2f3"/>
              <circle cx="360" cy="40" r="10" fill="#fde2f3"/>
              <circle cx="200" cy="10" r="15" fill="#e0d9ff"/>
              <!-- Additional Icons -->
              <g transform="translate(200, 180)">
                <text x="0" y="0" text-anchor="middle" fill="#a23bb1" font-size="20">✨</text>
              </g>
            </g>

            <!-- Match Indicator -->
            <g transform="translate(200, 250)">
              <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#a23bb1" opacity="0.1"/>
              <text x="0" y="5" text-anchor="middle" fill="#a23bb1" font-size="16" font-weight="bold">Perfect Match!</text>
            </g>
          </svg>
        </div>
      </div>
      <!-- Title -->
      <h1 class="text-lg font-bold text-gray-800 mb-0.5 z-10">
        Let's find you<br />Roommates and apartments
      </h1>
      <!-- Subtitle -->
      <div class="text-xs mb-2 z-10" style="color:#a23bb1;font-family:'Comic Sans MS', 'Comic Sans', cursive;letter-spacing:0.5px;">
        Find your perfect match for living, fun, and friendship.
      </div>
      <!-- Sign Up & Log In Buttons -->
      <div class="flex flex-row gap-2 w-full justify-center z-10 mb-2">
        <a href="onboarding.html" onclick="window.location.href='onboarding.html'; return false;" class="w-1/3 bg-gradient-to-r from-purple-500 via-pink-400 to-purple-700 hover:from-purple-700 hover:to-pink-500 text-white py-2 rounded-lg text-base font-semibold transform transition duration-200 hover:scale-105 hover:shadow-2xl shadow-lg">Sign Up</a>
        <a href="login.html" onclick="window.location.href='login.html'; return false;" class="w-1/3 bg-white hover:bg-purple-50 text-purple-800 py-2 rounded-lg text-base font-semibold border border-purple-200 transform transition duration-200 hover:scale-105 hover:shadow-2xl shadow">Log In</a>
      </div>
      <!-- OAuth Buttons -->
      <div class="flex flex-col gap-2 w-full justify-center mt-2 z-10">
        <button id="google-login" class="flex items-center justify-center gap-2 w-full bg-white border border-gray-200 hover:bg-purple-50 text-gray-800 py-2 rounded-lg text-base font-semibold shadow transition duration-200">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" class="w-5 h-5"> Sign in with Google
        </button>
      </div>
    </div>
    <footer class="mt-2 text-gray-600 text-xs opacity-90 flex items-center justify-center gap-1">
      Made with <span style="font-size:1.3em;">💖</span> for your next home adventure &copy; 2025 Roomatch
    </footer>
  </div>

</body>

<!-- Supabase OAuth logic -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  const supabase = window.supabase.createClient(
    'https://vgkvkmpckneceqfggzes.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU'
  );

  async function handlePostOAuthRedirect() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return; // Not logged in
    // Check if user profile exists in your users table
    const { data: userProfile } = await supabase
      .from('users')
      .select('id')
      .eq('auth_id', user.id)
      .single();
    if (userProfile) {
      window.location.href = 'apt-feed.html';
    } else {
      window.location.href = 'onboarding.html';
    }
  }

  document.getElementById('google-login').addEventListener('click', async () => {
    await supabase.auth.signInWithOAuth({ 
      provider: 'google',
      options: { redirectTo: window.location.origin + '/html/index.html' }
    });
    // After redirect, handlePostOAuthRedirect will run
  });

  document.getElementById('facebook-login').addEventListener('click', async () => {
    await supabase.auth.signInWithOAuth({ 
      provider: 'facebook',
      options: { redirectTo: window.location.origin + '/html/index.html' }
    });
    // After redirect, handlePostOAuthRedirect will run
  });

  // Only run this after OAuth redirect (not on every page load)
  // Detect if we are returning from OAuth (Supabase sets access_token in URL hash)
  if (window.location.hash && window.location.hash.includes('access_token')) {
    handlePostOAuthRedirect();
  }
</script>

</html>

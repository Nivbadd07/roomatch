<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ROOMATCH - Looking For</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=101827&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      background: white;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      font-family: '101827', sans-serif;
    }

    .wave1 {
      position: fixed;
      width: 200%;
      height: 100%;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      background: white;
      opacity: 0.4;
      z-index: 1;
      animation: waveMove 12s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes waveMove {
      0% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-48%) translateY(10px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    .svg-bg {
      position: absolute;
      top: 40vh;
      left: 50vw;
      transform: translate(-50%, -50%) scale(1.2);
      z-index: 0;
      opacity: 0.10;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
      border-radius: 2rem;
      border: 1.5px solid rgba(118, 76, 138, 0.13);
      padding: 3rem 2.5rem 3rem 2.5rem;
      max-width: 600px;
      min-height: 520px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .border-gradient-anim {
      pointer-events: none;
      border-radius: 2rem;
      background: #764C8A;
      opacity: 0.5;
      filter: blur(10px);
      animation: borderAnim 6s linear infinite alternate;
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      z-index: 0;
    }

    @keyframes borderAnim {
      0% { opacity: 0.5; filter: blur(10px); }
      100% { opacity: 0.8; filter: blur(18px); }
    }

    .main-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2d1b4d;
      margin-bottom: 0.3rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 2;
    }

    .subtitle {
      color: #111;
      font-size: 1.4rem;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      margin-bottom: 1.5rem;
      z-index: 2;
    }

    .modern-btn, .modern-btn.roommates {
      background: #fff;
      color: #764C8A;
      border: 2px solid #764C8A;
      font-weight: bold;
      box-shadow: 0 2px 12px rgba(118, 76, 138, 0.10);
      font-size: 1.18rem;
      padding: 1.1rem 0;
      border-radius: 1.2rem;
      width: 100%;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      position: relative;
      outline: none;
      transition: all 0.18s cubic-bezier(.4,1.7,.6,.97), box-shadow 0.18s;
      letter-spacing: 0.03em;
      font-family: inherit;
    }
    .modern-btn i, .modern-btn.roommates i {
      font-size: 1.5em;
      color: #764C8A;
      margin-right: 0.3em;
      transition: color 0.18s;
    }
    .modern-btn:hover, .modern-btn.roommates:hover {
      background: #fff;
      color: #764C8A;
      border-color: #764C8A;
      box-shadow: 0 4px 24px 0 rgba(118, 76, 138, 0.1);
      transform: translateY(-2px) scale(1.04);
    }
    .modern-btn:active, .modern-btn.roommates:active {
      background: #fff;
      color: #764C8A;
      border-color: #764C8A;
      box-shadow: 0 0 0 2px #764C8A;
      transform: scale(0.98);
    }
    .modern-btn:focus, .modern-btn.roommates:focus {
      box-shadow: 0 0 0 3px #764C8A, 0 0 20px #764C8A;
      outline: none;
    }

    .divider {
      color: #111;
      font-weight: bold;
      margin: 0.3rem 0 0.8rem 0;
      font-size: 1.5rem;
      opacity: 0.7;
      letter-spacing: 0.2em;
      z-index: 2;
    }

    .back-link {
      color: #111;
      text-decoration: underline;
      font-weight: 500;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1rem;
      transition: color 0.2s;
      z-index: 2;
    }

    .back-link:hover {
      color: #2d1b4d;
    }

    @media (max-width: 600px) {
      .glass-card {
        padding: 2rem 0.5rem 2rem 0.5rem;
        max-width: 98vw;
      }
      .main-title { font-size: 1.3rem; }
      .subtitle { font-size: 1rem; }
    }

    .btn-img-placeholder {
      display: inline-block;
      width: 44px;
      height: 44px;
      background: transparent;
      margin-left: 0.7em;
      border-radius: 0.5em;
      vertical-align: middle;
    }

    @media (max-width: 768px) {
      .max-w-3xl .flex-row { flex-direction: column !important; }
    }
  </style>
</head>

<body class="bg-white min-h-screen flex flex-col justify-start items-center w-full relative">
  <div class="wave1"></div>
  <section class="w-full min-h-[80vh] flex flex-col items-center justify-center py-8 px-4 relative z-10">
    <div class="max-w-4xl w-full mx-auto flex flex-col items-center">
      <div class="main-title mb-4 text-center flex flex-col items-center text-4xl md:text-5xl font-extrabold">
        <span>What Are You Looking For Now?</span> <span style="font-size:2.5em;"></span>
      </div>
      <div class="subtitle mb-12 text-center text-2xl md:text-3xl">
        You will be able to change it anytime at <b>Settings</b>
      </div>
    </div>
    <div class="w-full max-w-4xl flex flex-col md:flex-row gap-16 justify-center items-stretch">
      <a href="apt-pref.html" class="flex-1 w-full flex items-center justify-center">
        <button class="modern-btn w-full flex flex-row items-center justify-between text-2xl md:text-3xl py-10 pl-6 pr-6 h-64">
          <span class="flex items-center font-bold"><i class="fa-solid fa-building mr-4 text-3xl md:text-4xl"></i> Apartments</span>
          <img src="https://storage.googleapis.com/roomatch-prod-static-site/157dbed3-fca0-4d77-a151-a45dd2124219.png" alt="Apartments" class="object-contain w-36 h-36 ml-6 rounded" />
        </button>
      </a>
      <a href="upload-apt.html" class="flex-1 w-full flex items-center justify-center">
        <button class="modern-btn roommates w-full flex flex-row items-center justify-between text-2xl md:text-3xl py-10 pl-6 pr-6 h-64">
          <span class="flex items-center text-2xl md:text-3xl"><i class="fa-solid fa-user-group mr-4 text-3xl md:text-4xl"></i> Roommates</span>
          <img src="https://storage.googleapis.com/roomatch-prod-static-site/%D7%94%D7%95%D7%A8%D7%93%D7%94%20(1).png" alt="Roommates" class="object-contain w-36 h-36 ml-6 rounded" />
        </button>
      </a>
    </div>
    <a href="onboarding.html" class="block mx-auto mt-12 px-8 py-3 bg-purple-200 font-bold text-lg rounded-full text-center w-max" style="color:#101827;">Back</a>
  </section>
  <style>
    .main-title, .subtitle { z-index: 2; }
    @media (max-width: 768px) {
      .max-w-3xl .flex-row { flex-direction: column !important; }
    }
  </style>

  <script>
    const SUPABASE_URL = 'https://vgkvkmpckneceqfggzes.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function setUserTypeAndNavigate(type, url) {
      const userId = localStorage.getItem('user_id');
      localStorage.setItem('user_type', type);
      if (userId) {
        const { error } = await supabaseClient
          .from('users')
          .update({ user_type: type })
          .eq('id', userId);
        if (error) {
          alert('Error updating user type: ' + error.message);
          return;
        }
      }
      window.location.href = url;
    }

    window.addEventListener('DOMContentLoaded', function() {
      const aptBtn = document.querySelector('.modern-btn:not(.roommates)');
      const roommatesBtn = document.querySelector('.modern-btn.roommates');
      if (aptBtn) {
        aptBtn.addEventListener('click', function(e) {
          e.preventDefault();
          setUserTypeAndNavigate('Looking for Apt', 'apt-pref.html');
        });
      }
      if (roommatesBtn) {
        roommatesBtn.addEventListener('click', function(e) {
          e.preventDefault();
          setUserTypeAndNavigate('Looking for Roomate', 'upload-apt.html');
        });
      }
    });
  </script>

</body>

</html>

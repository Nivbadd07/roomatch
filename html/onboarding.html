<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOMATCH - Onboarding</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;900&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      background: #F2F4F5;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Rubik', sans-serif;
    }
    .onboard-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: white;
      opacity: 0.7;
    }
    .onboard-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      transform: scale(0.85);
      transform-origin: center center;
    }
    .onboard-card {
      background: rgba(255,255,255,0.97);
      box-shadow: 0 12px 48px 0 rgba(162, 59, 177, 0.18);
      border-radius: 1.5rem;
      border: 2.5px solid #e0d9ff;
      padding: 3.5rem 2rem 3.5rem 2rem;
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-height: 70vh;
      transition: box-shadow 0.3s;
    }
    .onboard-card::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 3rem;
      background: linear-gradient(120deg, #fde2f3, #764C8A 60%, #e0d9ff 100%);
      opacity: 0.18;
      z-index: 0;
      filter: blur(12px);
      pointer-events: none;
    }
    .onboard-stepper {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 2.5rem;
      z-index: 2;
      position: relative;
    }
    .onboard-step-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e0d9ff;
      border: 3px solid #764C8A;
      transition: background 0.3s, border 0.3s;
      box-shadow: 0 2px 8px #764C8A, 0 0 0 4px #fde2f3;
    }
    .onboard-step-dot.active {
      background: #764C8A;
      border-color: #764C8A;
      box-shadow: 0 2px 16px #764C8A, 0 0 0 6px #fde2f3;
    }
    .onboard-title {
      font-size: 3rem;
      font-weight: 900;
      color: #2d1b4d;
      margin-bottom: 0.7rem;
      letter-spacing: 0.5px;
      text-align: center;
      z-index: 2;
      cursor: pointer;
    }
    .onboard-subtitle {
      color: #764C8A;
      font-size: 1.5rem;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      margin-bottom: 2.2rem;
      text-align: center;
      z-index: 2;
    }
    .onboard-input, .onboard-select {
      width: 100%;
      padding: 1.3rem;
      margin-bottom: 1.7rem;
      border: none;
      border-radius: 1.3rem;
      font-size: 1.3rem;
      background: #f8f6fc;
      color: #541257;
      transition: all 0.2s;
      outline: none;
      box-shadow: 0 2px 8px rgba(162,59,177,0.06);
      font-family: 'Rubik', sans-serif;
    }
    .onboard-input::placeholder, .onboard-select::placeholder {
      font-family: 'Rubik', sans-serif;
      color: #764C8A;
      opacity: 0.7;
    }
    .onboard-input:focus, .onboard-select:focus {
      background: #f3e8ff;
      box-shadow: 0 4px 12px rgba(162,59,177,0.12);
    }
    .onboard-btn,
    .back-btn {
      width: 220px !important;
      min-width: 220px !important;
      max-width: 220px !important;
      height: 70px !important;
      min-height: 70px !important;
      box-sizing: border-box !important;
      padding: 1.3rem 0 !important;
      font-size: 1.5rem !important;
      font-weight: 700 !important;
      font-family: inherit !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 1.5rem !important;
      text-align: center !important;
      letter-spacing: 0.7px !important;
      margin: 0 auto !important;
      box-shadow: 0 4px 16px rgba(118,76,138,0.13) !important;
      appearance: none !important;
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
      border: none !important;
    }
    .onboard-btn {
      background: #764C8A;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 2.2rem;
      margin-bottom: 0.5rem;
      transition: background 0.2s, transform 0.2s;
    }
    .back-btn {
      background: #e0d9ff !important;
      color: #764C8A !important;
      transform: none !important;
    }
    .onboard-btn:disabled {
      background: #e0d9ff;
      color: #764C8A;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .onboard-btn:hover:not(:disabled) {
      background: #5e3c6e;
      transform: translateY(-2px) scale(1.04);
    }
    .onboard-error {
      color: #d32f2f;
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      text-align: center;
      min-height: 1.5em;
      z-index: 2;
    }
    .interests-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.1rem;
      justify-items: center;
      margin-bottom: 2.2rem;
      z-index: 2;
    }
    .interest-btn {
      padding: 1.1rem 2.1rem;
      border: 2px solid #764C8A;
      border-radius: 2.5rem;
      font-size: 1.2rem;
      background-color: #fff;
      color: #764C8A;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      box-shadow: 0 1px 6px #e0d9ff;
    }
    .interest-btn.selected {
      background-color: #764C8A;
      color: white;
      border-color: #764C8A;
      box-shadow: 0 2px 12px #764C8A;
    }
    .age-scroll {
      width: 100%;
      max-width: 320px;
      margin: 0 auto 1.7rem auto;
      height: 220px;
      overflow-y: auto;
      background: rgba(255,255,255,0.8);
      border-radius: 1.5rem;
      box-shadow: 0 2px 12px #e0d9ff;
      border: 2px solid #e0d9ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      scrollbar-width: thin;
      scrollbar-color: #764C8A #e0d9ff;
      padding: 0.5rem 0;
    }
    .age-scroll::-webkit-scrollbar {
      width: 8px;
      display: block;
    }
    .age-scroll::-webkit-scrollbar-track {
      background: #e0d9ff;
      border-radius: 4px;
    }
    .age-scroll::-webkit-scrollbar-thumb {
      background: #764C8A;
      border-radius: 4px;
    }
    .age-option {
      height: 48px;
      line-height: 48px;
      font-size: 1.5rem;
      cursor: pointer;
      width: 90%;
      text-align: center;
      border-radius: 12px;
      color: #6b7280;
      background: none;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      transition: all 0.2s;
      margin: 2px 0;
      padding: 0 1rem;
    }
    .age-option:hover {
      background: rgba(253,226,243,0.1);
      color: #764C8A;
    }
    .age-option.selected {
      color: #764C8A;
      font-weight: bold;
      font-size: 1.8rem;
      background: rgba(253,226,243,0.18);
      border-radius: 18px;
      box-shadow: 0 2px 12px #fde2f3;
      transform: scale(1.05);
    }
    .onboard-summary {
      font-size: 1.3rem;
      color: #2d1b4d;
      background: #f8f6fc;
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 12px #e0d9ff;
      z-index: 2;
    }
    .onboard-summary span {
      display: inline-block;
      background: #e0d9ff;
      color: #764C8A;
      border-radius: 1rem;
      padding: 0.4rem 1.1rem;
      margin: 0.2rem 0.3rem 0.2rem 0;
      font-size: 1.1rem;
    }
    .photo-upload-box {
      width: 120px;
      height: 120px;
      border: 2.5px dashed #764C8A;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.8);
      transition: background-color 0.3s;
      margin: 0 auto 1.5rem auto;
      position: relative;
    }
    .photo-upload-box:hover {
      background-color: #f3e8ff;
    }
    .plus-circle {
      background: white;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #764C8A;
      font-weight: bold;
      box-shadow: 0 2px 8px #e0d9ff;
    }
    .photo-preview {
      display: block;
      margin: 0 auto 1.5rem auto;
      border-radius: 1.2rem;
      box-shadow: 0 2px 12px #e0d9ff;
      max-width: 180px;
      max-height: 180px;
      object-fit: cover;
    }
    .quiz-yn-btn.selected {
      background: #764C8A;
      color: #fff !important;
      border-color: #764C8A;
      box-shadow: 0 2px 12px #764C8A;
      font-weight: bold;
      transform: scale(1.08);
    }
    .gender-btn {
      background: #f8f6fc;
      border: 2px solid #764C8A;
      color: #764C8A;
      border-radius: 1.5rem;
      font-size: 1.3rem;
      font-weight: 600;
      padding: 1.1rem 2.2rem;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 2px 8px #e0d9ff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .gender-btn.selected {
      background: #764C8A;
      color: #fff !important;
      border-color: #764C8A;
      box-shadow: 0 2px 12px #764C8A;
      transform: scale(1.06);
    }
    .gender-btn i {
      font-size: 1.5em;
    }
    @media (max-width: 900px) {
      body { display: block; align-items: flex-start; justify-content: flex-start; min-height: 100vh; overflow-y: auto; }
      .onboard-card {
        max-width: 99vw;
        padding: 1.5rem 0.5rem 1.5rem 0.5rem;
      }
      .onboard-title { font-size: 2rem; }
      .onboard-subtitle { font-size: 1.1rem; }
    }
    .onboard-progress-bar-container {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      z-index: 100;
      background: transparent;
      padding: 0 0 18px 0;
      pointer-events: none;
    }
    .onboard-progress-bar-bg {
      width: 98vw;
      max-width: 900px;
      margin: 0 auto;
      height: 24px;
      background: rgba(118, 76, 138, 0.10);
      border-radius: 16px;
      box-shadow: 0 2px 18px #e0d9ff;
      overflow: hidden;
      position: relative;
    }
    .onboard-progress-bar-fill {
      height: 100%;
      background: #764C8A;
      border-radius: 16px;
      box-shadow: 0 0 16px #764C8A55;
      width: 0%;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }
    .onboard-btn-row {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 2.2rem;
    }
  </style>
</head>
<body class="min-h-screen overflow-y-auto">
  <div class="onboard-bg"></div>
  <div class="onboard-container">
      <form id="onboardForm" autocomplete="off">
        <div id="stepContent"></div>

        <div class="onboard-btn-row">
          <button type="button" class="onboard-btn onboard-btn-shared" id="nextBtn">Continue</button>
        </div>
      </form>
  </div>
  <!-- Progress bar at the bottom of the page -->
  <div class="onboard-progress-bar-container">
    <div class="onboard-progress-bar-bg">
      <div class="onboard-progress-bar-fill" id="onboardProgressBar"></div>
    </div>
  </div>
  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://vgkvkmpckneceqfggzes.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // GCP Configuration
    const GCP_BUCKET_NAME = 'roomatch-prod-static-site';
    const GCP_PROJECT_ID = 'roomatch-prod';

    // Function to upload image to GCP
    async function uploadImageToGCP(file) {
        try {
            // Create a unique filename
            const timestamp = new Date().getTime();
            const filename = `User_Pics/${timestamp}_${file.name}`;
            
            // Create form data
            const formData = new FormData();
            formData.append('file', file);
            formData.append('filename', filename);
            
            // Send to backend endpoint
            const response = await fetch('https://roomatch-prod-1-109620478954.europe-west1.run.app/api/upload-to-gcp', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                throw new Error('Upload failed');
            }
            
            const data = await response.json();
            return data.publicUrl;
        } catch (error) {
            console.error('Error uploading to GCP:', error);
            throw error;
        }
    }

    // --- Onboarding Steps Data ---
    const steps = [
      // Combined Personal Info Step
      {
        title: "Let's Get Started!",
        subtitle: "Please enter your name, ID, and email address",
        render: () => `
          <input id='nameInput' class='onboard-input' type='text' maxlength='32' autocomplete='off' placeholder='Full Name' />
          <input id='idInput' class='onboard-input' type='text' placeholder='Please add ID (minimum 8 digits)' maxlength='20' autocomplete='off' />
          <div id='idError' class='text-red-500 text-sm mt-1'></div>
          <input id='emailInput' class='onboard-input' type='email' placeholder='Email Address' maxlength='40' autocomplete='off' />
          <div id='emailError' class='text-red-500 text-sm mt-1'></div>
        `,
        validate: () => {
          const name = document.getElementById('nameInput').value.trim();
          const id = document.getElementById('idInput').value.trim();
          const email = document.getElementById('emailInput').value.trim();
          const idError = document.getElementById('idError');
          const emailError = document.getElementById('emailError');
          let error = null;
          idError.textContent = '';
          emailError.textContent = '';
          if (!name) error = 'Please enter your name!';
          else if (!/^[A-Za-z ]+$/.test(name)) error = 'Name must contain only English letters and spaces!';
          if (!id) {
            idError.textContent = 'Please enter your ID!';
            error = 'Please enter your ID!';
          } else if (!/^\d{8,}$/.test(id)) {
            idError.textContent = 'ID must be at least 8 digits!';
            error = 'ID must be at least 8 digits!';
          }
          if (!email) {
            emailError.textContent = 'Please enter your email!';
            error = 'Please enter your email!';
          } else if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
            emailError.textContent = 'Please enter a valid email address!';
            error = 'Please enter a valid email address!';
          }
          return error;
        },
        save: () => {
          const name = document.getElementById('nameInput').value.trim();
          const id = document.getElementById('idInput').value.trim();
          const email = document.getElementById('emailInput').value.trim();
          localStorage.setItem('user_name', name);
          localStorage.setItem('user_id', id);
          localStorage.setItem('user_email', email);
        }
      },
      {
        title: "Create a Password",
        subtitle: "Set a secure password for your account",
        render: () => `
          <input id='passwordInput' class='onboard-input' type='password' placeholder='Password' maxlength='32' autocomplete='new-password' />
          <div class='text-sm text-gray-600 mt-2'>
            Password must contain:
            <ul class='list-disc list-inside mt-1'>
              <li id='lengthCheck'>At least 8 characters</li>
              <li id='uppercaseCheck'>One uppercase letter</li>
              <li id='lowercaseCheck'>One lowercase letter</li>
              <li id='numberCheck'>One number</li>
              <li id='specialCheck'>One special character</li>
            </ul>
          </div>
        `,
        validate: () => {
          const password = document.getElementById('passwordInput').value.trim();
          const lengthCheck = document.getElementById('lengthCheck');
          const uppercaseCheck = document.getElementById('uppercaseCheck');
          const lowercaseCheck = document.getElementById('lowercaseCheck');
          const numberCheck = document.getElementById('numberCheck');
          const specialCheck = document.getElementById('specialCheck');
          
          // Reset all checks
          [lengthCheck, uppercaseCheck, lowercaseCheck, numberCheck, specialCheck].forEach(el => {
            el.style.color = '#4B5563';
          });
          
          if (!password) return 'Please enter your password!';
          
          // Check each requirement
          const hasLength = password.length >= 8;
          const hasUppercase = /[A-Z]/.test(password);
          const hasLowercase = /[a-z]/.test(password);
          const hasNumber = /[0-9]/.test(password);
          const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
          
          // Update visual feedback
          if (hasLength) lengthCheck.style.color = '#059669';
          if (hasUppercase) uppercaseCheck.style.color = '#059669';
          if (hasLowercase) lowercaseCheck.style.color = '#059669';
          if (hasNumber) numberCheck.style.color = '#059669';
          if (hasSpecial) specialCheck.style.color = '#059669';
          
          if (!hasLength || !hasUppercase || !hasLowercase || !hasNumber || !hasSpecial) {
            return 'Please meet all password requirements!';
          }
          
          return null;
        },
        save: () => {
          localStorage.setItem('user_password', document.getElementById('passwordInput').value.trim());
        }
      },
      {
        title: "About You",
        subtitle: "Select your gender and write a short bio",
        render: () => `
          <div class='mb-4'>
            <label class='block mb-2 font-semibold'>Gender</label>
            <div class='flex gap-6 mb-6'>
              <button type='button' class='gender-btn' data-gender='male'>
                <i class='fas fa-mars mr-2'></i> Male
              </button>
              <button type='button' class='gender-btn' data-gender='female'>
                <i class='fas fa-venus mr-2'></i> Female
              </button>
              <button type='button' class='gender-btn' data-gender='other'>
                <i class='fas fa-genderless mr-2'></i> Other
              </button>
            </div>
            <label class='block mb-2 font-semibold'>Tell us about you! </label>
            <textarea id='bioInput' class='onboard-input' placeholder='Tell us about yourself...' maxlength='300' rows='7' style='min-height:120px;font-size:1.2rem;'></textarea>
          </div>
        `,
        validate: () => {
          const gender = document.querySelector('.gender-btn.selected');
          const bio = document.getElementById('bioInput').value.trim();
          if (!gender) return 'Please select your gender!';
          if (!bio) return 'Please write a short bio!';
          return null;
        },
        save: () => {
          const genderBtn = document.querySelector('.gender-btn.selected');
          const gender = genderBtn ? genderBtn.getAttribute('data-gender') : '';
          const bio = document.getElementById('bioInput').value.trim();
          localStorage.setItem('user_gender', gender);
          localStorage.setItem('user_bio', bio);
        }
      },
      {
        title: "How Old Are You?",
        subtitle: "Let's find your perfect match ✨",
        render: () => {
          let ageOptions = '';
          for (let i = 21; i <= 60; i++) {
            ageOptions += `<div class='age-option' data-age='${i}'>${i}</div>`;
          }
          return `<div class='age-scroll' id='ageScroll'>${ageOptions}</div>`;
        },
        validate: () => {
          const selected = document.querySelector('.age-option.selected');
          if (!selected) return 'Please select your age!';
          return null;
        },
        save: () => {
          const selected = document.querySelector('.age-option.selected');
          if (selected) localStorage.setItem('user_age', selected.dataset.age);
        }
      },
      {
        title: "Select Interests",
        subtitle: "Tell us what piques your curiosity and passions",
        render: () => `
          <div class='interests-grid' id='interestsGrid'>
            <button type='button' class='interest-btn'><i class='fas fa-book'></i> Reading</button>
            <button type='button' class='interest-btn'><i class='fas fa-camera'></i> Photography</button>
            <button type='button' class='interest-btn'><i class='fas fa-gamepad'></i> Gaming</button>
            <button type='button' class='interest-btn'><i class='fas fa-music'></i> Music</button>
            <button type='button' class='interest-btn'><i class='fas fa-plane'></i> Travel</button>
            <button type='button' class='interest-btn'><i class='fas fa-paint-brush'></i> Painting</button>
            <button type='button' class='interest-btn'><i class='fas fa-scale-balanced'></i> Politics</button>
            <button type='button' class='interest-btn'><i class='fas fa-hands-helping'></i> Charity</button>
            <button type='button' class='interest-btn'><i class='fas fa-utensils'></i> Cooking</button>
            <button type='button' class='interest-btn'><i class='fas fa-paw'></i> Pets</button>
            <button type='button' class='interest-btn'><i class='fas fa-basketball-ball'></i> Sports</button>
            <button type='button' class='interest-btn'><i class='fas fa-tshirt'></i> Fashion</button>
          </div>
        `,
        validate: () => {
          const selected = document.querySelectorAll('.interest-btn.selected');
          if (selected.length === 0) return 'Please select at least one interest!';
          return null;
        },
        save: () => {
          const selected = document.querySelectorAll('.interest-btn.selected');
          const interests = Array.from(selected).map(btn => btn.textContent.trim());
          localStorage.setItem('user_interests', JSON.stringify(interests));
        }
      },
      // Roommate Quiz Steps
      {
        title: "Let's Start With Yes And No Questions",
        subtitle: "Help us understand your lifestyle preferences.",
        render: () => `
          <div class='space-y-8'>
            <div class='text-left'>
              <p class='text-gray-700 mb-3 text-xl font-bold'>Do you work or study from home?</p>
              <div class='flex gap-4'>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='work_home' data-a='yes'>YES</button>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='work_home' data-a='no'>NO</button>
              </div>
            </div>
            <div class='text-left'>
              <p class='text-gray-700 mb-3 text-xl font-bold'>Do you agree to share responsibility for cleaning?</p>
              <div class='flex gap-4'>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='cleaning_resp' data-a='yes'>YES</button>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='cleaning_resp' data-a='no'>NO</button>
              </div>
            </div>
            <div class='text-left'>
              <p class='text-gray-700 mb-3 text-xl font-bold'>Do you have a pet or are you planning to get one?</p>
              <div class='flex gap-4'>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='pet' data-a='yes'>YES</button>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='pet' data-a='no'>NO</button>
              </div>
            </div>
            <div class='text-left'>
              <p class='text-gray-700 mb-3 text-xl font-bold'>Do you smoke?</p>
              <div class='flex gap-4'>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='smoke' data-a='yes'>YES</button>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='smoke' data-a='no'>NO</button>
              </div>
            </div>
            <div class='text-left'>
              <p class='text-gray-700 mb-3 text-xl font-bold'>Are you comfortable with a partner who smokes?</p>
              <div class='flex gap-4'>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='ok_smoke' data-a='yes'>YES</button>
                <button type='button' class='quiz-yn-btn px-5 py-2.5 rounded-full border border-[#764C8A] text-[#764C8A] hover:bg-[#f3e8ff]' data-q='ok_smoke' data-a='no'>NO</button>
              </div>
            </div>
          </div>
        `,
        validate: () => {
          const questions = ['work_home','cleaning_resp','pet','smoke','ok_smoke'];
          for (let q of questions) {
            if (!window.quizAnswers || !window.quizAnswers[q]) return 'Please answer all yes/no questions!';
          }
          return null;
        },
        save: () => {
          localStorage.setItem('roommate_quiz_yn', JSON.stringify(window.quizAnswers));
        }
      },
      {
        title: "We Are Not Petty, We Just Want To Find You The Perfect Roommate",
        subtitle: "A few more details about your habits.",
        render: () => `
          <div class='space-y-8 text-left'>
            <div>
              <p class='text-gray-700 mb-3 text-xl font-bold'>How important is cleanliness at home to you?</p>
              <div class='flex justify-start items-center gap-1 mb-2'>
                ${[1,2,3,4,5].map(n => `
                  <div class='flex flex-col items-center'>
                    <input type='radio' name='cleanliness' value='${n}' class='w-5 h-5 quiz-radio' id='cleanliness${n}'>
                    <label for='cleanliness${n}' class='text-sm text-gray-600'>${n}</label>
                  </div>
                `).join('')}
              </div>
              <div class='flex items-center text-xs text-gray-500'>
                <span>Not Important</span>
                <span class='ml-8'>Very Important</span>
              </div>
            </div>
            <div>
              <p class='text-gray-700 mb-3 text-xl font-bold'>How often do you prefer to clean the common areas?</p>
              <div class='space-y-3'>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='cleaning' value='Once a week' class='w-5 h-5 quiz-radio'>
                  <span>Once a week</span>
                </label>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='cleaning' value='Once every two weeks' class='w-5 h-5 quiz-radio'>
                  <span>Once every two weeks</span>
                </label>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='cleaning' value='Once a month' class='w-5 h-5 quiz-radio'>
                  <span>Once a month</span>
                </label>
              </div>
            </div>
            <div>
              <p class='text-gray-700 mb-3 text-xl font-bold'>How often do you invite friends or guests home?</p>
              <div class='space-y-3'>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='guests' value='Once a week' class='w-5 h-5 quiz-radio'>
                  <span>Once a week</span>
                </label>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='guests' value='Once every two weeks' class='w-5 h-5 quiz-radio'>
                  <span>Once every two weeks</span>
                </label>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='guests' value='Once a month' class='w-5 h-5 quiz-radio'>
                  <span>Once a month</span>
                </label>
              </div>
            </div>
            <div>
              <p class='text-gray-700 mb-3 text-xl font-bold'>How sensitive are you to noise during study or rest hours?</p>
              <div class='space-y-3'>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='noise' value='very sensitive' class='w-5 h-5 quiz-radio'>
                  <span>Very sensitive</span>
                </label>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='noise' value='acceptable to me' class='w-5 h-5 quiz-radio'>
                  <span>Acceptable to me</span>
                </label>
                <label class='block flex items-center gap-2'>
                  <input type='radio' name='noise' value='Not sensitive at all' class='w-5 h-5 quiz-radio'>
                  <span>Not sensitive at all</span>
                </label>
              </div>
            </div>
          </div>
        `,
        validate: () => {
          // All radio groups must have a checked value
          const requiredRadios = ['cleanliness','cleaning','guests','noise'];
          for (let name of requiredRadios) {
            if (!document.querySelector(`input[name='${name}']:checked`)) {
              return 'Please answer all the questions!';
            }
          }
          return null;
        },
        save: () => {
          const quizRadio = {};
          document.querySelectorAll('input.quiz-radio:checked').forEach(input => {
            quizRadio[input.name] = input.value;
          });
          localStorage.setItem('roommate_quiz_radio', JSON.stringify(quizRadio));
        }
      },
      {
        title: "Photo Upload",
        subtitle: "Add a profile picture",
        render: () => `
          <input id='photo-upload' type='file' accept='image/*' class='hidden'>
          <label for='photo-upload' class='photo-upload-box'>
            <div class='plus-circle'>+</div>
          </label>
          <img class='photo-preview' id='photo-preview' style='display:none;'/>
          <div id='upload-progress' style='display:none;' class='mt-4 text-center'>
            <p class='text-gray-600 mb-2'>Uploading...</p>
            <div class='w-full bg-gray-200 rounded-full h-2.5'>
              <div class='bg-purple-600 h-2.5 rounded-full' style='width: 0%' id='progress-bar'></div>
            </div>
          </div>
        `,
        validate: () => {
          const photoInput = document.getElementById('photo-upload');
          if (!photoInput || !photoInput.files.length) return 'Please upload a photo!';
          return null;
        },
        save: async () => {
          const photoInput = document.getElementById('photo-upload');
          const file = photoInput.files[0];
          if (file) {
            try {
              // Show progress
              const progressDiv = document.getElementById('upload-progress');
              const progressBar = document.getElementById('progress-bar');
              progressDiv.style.display = 'block';
              
              // Upload to GCP
              const publicUrl = await uploadImageToGCP(file);
              
              // Update preview and store URL
              const photoPreview = document.getElementById('photo-preview');
              photoPreview.src = publicUrl;
              photoPreview.style.display = 'block';
              localStorage.setItem('user_photo_url', publicUrl);
              
              // Hide progress
              progressDiv.style.display = 'none';
            } catch (error) {
              alert('Error uploading photo: ' + error.message);
              return;
            }
          }
        }
      },
      {
        title: "All Set!",
        subtitle: "Here's a quick summary before you continue:",
        render: () => {
          const name = localStorage.getItem('user_name') || '';
          const email = localStorage.getItem('user_email') || '';
          const age = localStorage.getItem('user_age') || '';
          const interests = JSON.parse(localStorage.getItem('user_interests') || '[]');
          const quizYN = JSON.parse(localStorage.getItem('roommate_quiz_yn') || '{}');
          const quizRadio = JSON.parse(localStorage.getItem('roommate_quiz_radio') || '{}');
          const photo = localStorage.getItem('user_photo_url');
          function show(val) { return val ? val : '<span style="color:#b0a4c0">Not answered</span>'; }
          return `
            <div class='onboard-summary'>
              <div><b>Name:</b> ${show(name)}</div>
              <div><b>Email:</b> ${show(email)}</div>
              <div><b>Age:</b> ${show(age)}</div>
              <div><b>Interests:</b> ${interests.length ? interests.map(i => `<span>${i}</span>`).join('') : show('')}</div>
              <div><b>Roommate Quiz:</b><br>
                <ul style='margin-left:1em;'>
                  <li>Work/study from home: <b>${show(quizYN.work_home)}</b></li>
                  <li>Share cleaning: <b>${show(quizYN.cleaning_resp)}</b></li>
                  <li>Pet: <b>${show(quizYN.pet)}</b></li>
                  <li>Smoke: <b>${show(quizYN.smoke)}</b></li>
                  <li>OK with smoking roommate: <b>${show(quizYN.ok_smoke)}</b></li>
                  <li>Cleanliness (1-5): <b>${show(quizRadio.cleanliness)}</b></li>
                  <li>Cleaning frequency: <b>${show(quizRadio.cleaning)}</b></li>
                  <li>Guests: <b>${show(quizRadio.guests)}</b></li>
                  <li>Noise sensitivity: <b>${show(quizRadio.noise)}</b></li>
                </ul>
              </div>
              <div><b>Photo:</b><br>${photo ? `<img src='${photo}' style='max-width:120px;max-height:120px;border-radius:1rem;margin-top:0.5em;'/>` : show('')}</div>
            </div>
            <div class='onboard-subtitle'>Ready to start your Roomatch journey?</div>
          `;
        },
        validate: () => null,
        save: async () => {
          const name = localStorage.getItem('user_name');
          const manualId = localStorage.getItem('user_id'); // Manual user ID from onboarding
          const email = localStorage.getItem('user_email');
          const password = localStorage.getItem('user_password');
          const age = localStorage.getItem('user_age');
          const interests = JSON.parse(localStorage.getItem('user_interests') || '[]');
          const gender = localStorage.getItem('user_gender') || null;
          const bio = localStorage.getItem('user_bio') || null;
          const photo_url = localStorage.getItem('user_photo_url');

          // 1. Sign up with Supabase Auth
          console.log('Signing up:', email, password);
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) {
            alert('Error signing up: ' + error.message);
            return;
          }
          const authUserId = data.user.id; // Supabase Auth UUID

          // 1.5. Wait a moment to ensure user is available for login
          await new Promise(res => setTimeout(res, 1000));

          // 1.6. Explicitly log in the user to ensure session is set
          console.log('Logging in:', email, password);
          const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (loginError) {
            alert('Error logging in: ' + loginError.message);
            return;
          }

          // 2. Insert into Supabase users table and get the inserted id
          const { data: userData, error: userInsertError } = await supabaseClient
            .from('users')
            .insert([{
              id: manualId ? parseInt(manualId) : null, // manual int8
              auth_id: authUserId, // uuid from Supabase Auth
              full_name: name,
              email: email,
              age: age ? parseInt(age) : null,
              interests: interests,
              gender: gender,
              bio: bio,
              profile_image_url: photo_url || null,
              password_hash: password // store plain password as requested
            }])
            .select(); // Get the inserted row(s)
          if (userInsertError) {
            alert('Error saving to database: ' + userInsertError.message);
            return;
          }
          const insertedUser = userData && userData[0];
          const userId = insertedUser ? insertedUser.id : null;

          const quizYN = JSON.parse(localStorage.getItem('roommate_quiz_yn') || '{}');
          const quizRadio = JSON.parse(localStorage.getItem('roommate_quiz_radio') || '{}');

          const userPreferences = {
            user_id: userId,
            works_from_home: quizYN.work_home === 'yes',
            shares_cleaning: quizYN.cleaning_resp === 'yes',
            has_or_wants_pet: quizYN.pet === 'yes',
            smokes: quizYN.smoke === 'yes',
            ok_with_smoker: quizYN.ok_smoke === 'yes',
            cleanliness_importance: quizRadio.cleanliness ? parseInt(quizRadio.cleanliness) : null,
            cleaning_frequency: quizRadio.cleaning || null,
            guest_frequency: quizRadio.guests || null,
            noise_sensitivity: quizRadio.noise || null
          };

          if (userId) {
            const { error: prefInsertError } = await supabaseClient
              .from('user_preferences')
              .insert([userPreferences]);
            if (prefInsertError) {
              alert('Error creating preferences row: ' + JSON.stringify(prefInsertError));
              return;
            }
          } else {
            alert('Could not determine user id for preferences insert.');
            return;
          }
        }
      }
    ];

    let currentStep = 0;
    let quizAnswers = {};
    try {
      const stored = localStorage.getItem('roommate_quiz_yn');
      if (stored) quizAnswers = JSON.parse(stored);
    } catch (e) { quizAnswers = {}; }
    const stepContent = document.getElementById('stepContent');
    const errorMsg = document.getElementById('errorMsg');
    const nextBtn = document.getElementById('nextBtn');

    function renderStep() {
      // Update progress bar
      const progressBar = document.getElementById('onboardProgressBar');
      if (progressBar) {
        const percent = ((currentStep + 1) / steps.length) * 100;
        progressBar.style.width = percent + '%';
      }
      // Content
      let backBtn = '';
      if (currentStep === 0) {
        backBtn = `<button type='button' id='backBtn' class='onboard-btn onboard-btn-shared back-btn'>Back</button>`;
      } else if (currentStep > 0) {
        backBtn = `<button type='button' id='backBtn' class='onboard-btn onboard-btn-shared back-btn'>Back</button>`;
      }
      stepContent.innerHTML = `
        <div class='onboard-title' ${currentStep === 0 ? 'onclick="window.location.href=\'index.html\'"' : ''}>${steps[currentStep].title}</div>
        <div class='onboard-subtitle'>${steps[currentStep].subtitle}</div>
        ${steps[currentStep].render()}
      `;
      errorMsg.textContent = '';
      // Special step logic
      if (currentStep === 3) { // Age
        document.querySelectorAll('.age-option').forEach(opt => {
          opt.addEventListener('click', () => {
            document.querySelectorAll('.age-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            opt.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
        });
        const savedAge = localStorage.getItem('user_age');
        if (savedAge) {
          const ageOption = document.querySelector(`.age-option[data-age='${savedAge}']`);
          if (ageOption) {
            ageOption.classList.add('selected');
            ageOption.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }
      if (currentStep === 4) { // Interests
        document.querySelectorAll('.interest-btn').forEach(btn => {
          btn.addEventListener('click', () => btn.classList.toggle('selected'));
        });
      }
      if (currentStep === 5) { // Roommate Quiz Yes/No
        window.quizAnswers = {};
        document.querySelectorAll('.quiz-yn-btn').forEach(btn => {
          btn.classList.remove('selected');
          btn.addEventListener('click', () => {
            const q = btn.getAttribute('data-q');
            const a = btn.getAttribute('data-a');
            document.querySelectorAll(`.quiz-yn-btn[data-q='${q}']`).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            window.quizAnswers[q] = a;
          });
        });
      }
      if (currentStep === 7) {
        // Radios work natively
      }
      if (currentStep === 7) { // Photo Upload
        window.onboardPhotoDataUrl = window.onboardPhotoDataUrl || null;
        const photoInput = document.getElementById('photo-upload');
        const photoPreview = document.getElementById('photo-preview');
        if (photoInput) {
          photoInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
                photoPreview.src = e.target.result;
                photoPreview.style.display = 'block';
                window.onboardPhotoDataUrl = e.target.result;
              };
              reader.readAsDataURL(file);
            } else {
              photoPreview.src = '';
              photoPreview.style.display = 'none';
              window.onboardPhotoDataUrl = null;
            }
          });
        }
      }
      if (currentStep === steps.length - 1) {
        nextBtn.textContent = 'Finish';
      } else {
        nextBtn.textContent = 'Continue';
      }
      // Centered button row logic
      const btnRow = document.querySelector('.onboard-btn-row');
      if (btnRow) {
        // Remove any existing back button
        const oldBackBtn = document.getElementById('backBtn');
        if (oldBackBtn) oldBackBtn.remove();
        if (backBtn) {
          btnRow.insertAdjacentHTML('afterbegin', backBtn);
          const backBtnEl = document.getElementById('backBtn');
          if (backBtnEl) {
            if (currentStep === 0) {
              backBtnEl.onclick = function() {
                window.location.href = 'index.html';
              };
            } else {
              backBtnEl.onclick = function() {
                if (currentStep > 0) {
                  currentStep--;
                  renderStep();
                }
              };
            }
          }
        }
      }
    }

    nextBtn.onclick = async function() {
      const validate = steps[currentStep].validate;
      const save = steps[currentStep].save;
      const error = validate ? validate() : null;
      if (error) {
        errorMsg.textContent = error;
        return;
      }
      if (save) await save();
      if (currentStep < steps.length - 1) {
        currentStep++;
        renderStep();
      } else {
        window.location.href = 'apt-room.html';
      }
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
        e.preventDefault();
        nextBtn.click();
      }
    });

    // Gender button selection logic
    document.addEventListener('click', function(e) {
      if (e.target.closest('.gender-btn')) {
        document.querySelectorAll('.gender-btn').forEach(btn => btn.classList.remove('selected'));
        e.target.closest('.gender-btn').classList.add('selected');
      }
    });

    renderStep();

    window.getOnboardingData = function() {
      return {
        name: localStorage.getItem('user_name') || '',
        email: localStorage.getItem('user_email') || '',
        password: localStorage.getItem('user_password') || '',
        age: localStorage.getItem('user_age') || '',
        interests: JSON.parse(localStorage.getItem('user_interests') || '[]'),
        quiz_yn: JSON.parse(localStorage.getItem('roommate_quiz_yn') || '{}'),
        quiz_radio: JSON.parse(localStorage.getItem('roommate_quiz_radio') || '{}'),
        photo: localStorage.getItem('user_photo_url') || ''
      };
    }
  </script>
</body>
</html>

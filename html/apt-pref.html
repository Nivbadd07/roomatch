<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOMATCH - Apartment Preferences</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      background: #F2F4F5;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      font-family: 'Rubik', sans-serif;
      padding: 2rem 0;
    }
    .svg-bg {
      position: fixed;
      top: 40vh;
      left: 50vw;
      transform: translate(-50%, -50%) scale(1.2);
      z-index: 0;
      opacity: 0.10;
      pointer-events: none;
    }
    .glass-card {
      background: white;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
      border-radius: 2rem;
      border: 1.5px solid rgba(118, 76, 138, 0.13);
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      max-width: 800px;
      width: 100%;
      margin: 4rem auto 2rem auto;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 0.8s cubic-bezier(.4,1.7,.6,.97);
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .border-gradient-anim {
      pointer-events: none;
      border-radius: 2rem;
      background: #764C8A;
      opacity: 0.5;
      filter: blur(10px);
      animation: borderAnim 6s linear infinite alternate;
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      z-index: 0;
    }
    @keyframes borderAnim {
      0% { opacity: 0.5; filter: blur(10px); }
      100% { opacity: 0.8; filter: blur(18px); }
    }
    .main-title {
      font-size: 2.2rem;
      font-weight: bold;
      color: #2d1b4d;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 2;
    }
    .subtitle {
      color: #764C8A;
      font-size: 1.1rem;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      margin-bottom: 2.2rem;
      z-index: 2;
    }
    .glass-select, .glass-input {
      background: #ffffff;
      border: none;
      border-radius: 1rem;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      color: #2d1b4d;
      margin-bottom: 0.7rem;
      width: 100%;
      box-shadow: 0 4px 12px rgba(118, 76, 138, 0.25);
      outline: none;
      transition: all 0.2s;
    }
    .glass-select:focus, .glass-input:focus {
      background: white;
      box-shadow: 0 4px 16px rgba(118, 76, 138, 0.35);
    }
    .glass-select::placeholder, .glass-input::placeholder {
      color: #764C8A;
      opacity: 0.8;
      font-weight: 500;
    }
    .feature-btn, .room-btn {
      background: rgba(255,255,255,0.7);
      border: 2px solid #764C8A;
      color: #764C8A;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.7rem 1.3rem;
      margin: 0.2rem 0.2rem 0.5rem 0.2rem;
      transition: all 0.2s cubic-bezier(.4,1.7,.6,.97);
      box-shadow: 0 2px 8px 0 rgba(118, 76, 138, 0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      outline: none;
      position: relative;
    }
    .feature-btn.selected-feature, .room-btn.selected-room {
      background: #764C8A;
      color: #fff !important;
      border-color: #764C8A;
      box-shadow: 0 0 18px #764C8A;
      animation: popSelected 0.4s cubic-bezier(.4,1.7,.6,.97);
    }
    @keyframes popSelected {
      0% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    .feature-btn:focus, .room-btn:focus {
      box-shadow: 0 0 0 2px #764C8A, 0 0 18px #764C8A;
    }
    .feature-btn:hover, .room-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px) scale(1.04);
    }
    .continue-btn {
      background: #764C8A;
      border: none;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(118, 76, 138, 0.13);
      transition: all 0.3s ease;
      font-size: 1.2rem;
      padding: 1.2rem 0;
      border-radius: 1.2rem;
      width: 100%;
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      outline: none;
    }
    .continue-btn:hover {
      background: #764C8A;
      box-shadow: 0 0 30px rgba(118, 76, 138, 0.18);
      filter: brightness(1.08);
    }
    .continue-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 30px #764C8A;
    }
    .continue-btn:focus {
      box-shadow: 0 0 0 3px #764C8A, 0 0 20px #764C8A;
    }
    .back-link {
      color: #000 !important;
      font-size: 1.1rem !important;
      font-weight: bold !important;
      text-decoration: underline;
    }
    .back-link:hover {
      color: #2d1b4d !important;
    }
    @media (max-width: 600px) {
      .glass-card {
        padding: 2rem 1rem 2rem 1rem;
        max-width: 98vw;
        margin: 2rem auto;
      }
      .main-title { font-size: 1.3rem; }
      .subtitle { font-size: 1rem; }
      body {
        padding: 1rem 0;
      }
    }
    .clearer-label {
      font-size: 1.08rem;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(118, 76, 138, 0.08), 0 0.5px 0px #fff;
      letter-spacing: 0.01em;
    }
    #minPrice, #maxPrice {
      background: #fff !important;
      opacity: 1 !important;
      box-shadow: 0 4px 12px rgba(118, 76, 138, 0.25) !important;
      border: none !important;
      z-index: 1;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center relative font-sans">

  <svg class="svg-bg" width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="200" cy="200" rx="180" ry="120" fill="#e0d9ff"/>
  </svg>
  <div class="flex flex-col items-center w-full max-w-3xl mt-12 mb-8 px-4">
    <div class="flex flex-col items-start w-full">
      <div class="main-title mb-1">
        <span>Which Apartment Are You Looking To Move Into?</span> <span style="font-size:1.5em;"></span>
      </div>
      <div class="subtitle mb-6">
        Set your preferences to find your perfect match!
      </div>
    </div>
    <form class="flex flex-col space-y-6 w-full max-w-3xl">
      <div class="flex flex-col md:flex-row gap-6 w-full">
        <div class="flex-1">
          <label class="block text-black font-bold mb-1 clearer-label">City</label>
          <div style="position:relative;">
            <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#764C8A;font-size:1.1em;">
              <i class="fa-solid fa-city"></i>
            </span>
            <select name="city" class="glass-select pl-10">
              <option disabled selected value="">Select city</option>
              <option>Tel Aviv</option>
              <option>Jerusalem</option>
              <option>Haifa</option>
            </select>
          </div>
        </div>
        <div class="flex-1">
          <label class="block text-black font-bold mb-1 clearer-label">Area</label>
          <div style="position:relative;">
            <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#764C8A;font-size:1.1em;">
              <i class="fa-solid fa-location-dot"></i>
            </span>
            <select name="area" class="glass-select pl-10">
              <option disabled selected value="">Select area</option>
              <option>Center</option>
              <option>North</option>
              <option>South</option>
            </select>
          </div>
        </div>
        <div class="flex-1">
          <label class="block text-black font-bold mb-1 clearer-label">Contract</label>
          <div style="position:relative;">
            <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#764C8A;font-size:1.1em;">
              <i class="fa-solid fa-file-signature"></i>
            </span>
            <select name="contract" class="glass-select pl-10">
              <option disabled selected value="">Select contract type</option>
              <option>Long term</option>
              <option>Short term</option>
              <option>Sublet</option>
            </select>
          </div>
        </div>
      </div>
      <div class="mt-4">
        <label class="block text-black font-bold mb-2 clearer-label">Features</label>
        <div class="flex flex-wrap justify-start gap-2">
          <button class="feature-btn" type="button">🏠 Balcony</button>
          <button class="feature-btn" type="button">🛗 Elevator</button>
          <button class="feature-btn" type="button">🛡 Mamad</button>
          <button class="feature-btn" type="button">📶 Wifi</button>
          <button class="feature-btn" type="button">🚗 Parking</button>
          <button class="feature-btn" type="button">📦 Storage</button>
          <button class="feature-btn" type="button">♿ Accessible</button>
        </div>
      </div>
      <div class="mt-4">
        <label class="block text-black font-bold mb-2 clearer-label">Rooms</label>
        <div class="flex flex-wrap justify-start gap-2">
          <button class="room-btn" type="button"><i class="fa-solid fa-door-open"></i> 2</button>
          <button class="room-btn" type="button"><i class="fa-solid fa-door-open"></i> 2.5</button>
          <button class="room-btn" type="button"><i class="fa-solid fa-door-open"></i> 3</button>
          <button class="room-btn" type="button"><i class="fa-solid fa-door-open"></i> 4</button>
          <button class="room-btn" type="button"><i class="fa-solid fa-door-open"></i> 5</button>
        </div>
      </div>
      <div class="mt-4">
        <label class="block text-black font-bold mb-2 clearer-label">Price Range</label>
        <div class="flex gap-2">
          <input id="minPrice" type="text" placeholder="Min Price" class="glass-input w-1/2 text-center font-semibold" />
          <span class="flex items-center font-bold text-[#764C8A]">–</span>
          <input id="maxPrice" type="text" placeholder="Max Price" class="glass-input w-1/2 text-center font-semibold" />
        </div>
      </div>
      <div class="mt-4">
        <label class="block text-black font-bold mb-2 clearer-label">Date of Entry</label>
        <div style="position:relative;">
          <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#764C8A;font-size:1.1em;">
            <i class="fa-solid fa-calendar-days"></i>
          </span>
          <input id="entryDate" type="date" class="glass-input pl-10 text-center">
        </div>
      </div>
      <button id="continueBtn" type="button" class="continue-btn"><i class="fa-solid fa-check"></i> Continue</button>
    </form>
    <a href="apt-room.html" class="block mx-auto mt-12 px-8 py-3 bg-purple-200 font-bold text-lg rounded-full text-center w-max" style="color:#101827;">Back</a>
  </div>

  <div id="successPopup" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg font-bold hidden z-50">
    Apartment preferences uploaded successfully!
  </div>

  <script>
    const SUPABASE_URL = 'https://vgkvkmpckneceqfggzes.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.querySelectorAll('.feature-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('selected-feature');
      });
    });

    document.querySelectorAll('.room-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.room-btn').forEach(b => {
          b.classList.remove('selected-room');
        });
        btn.classList.add('selected-room');
      });
    });

    document.getElementById('minPrice').addEventListener('input', function () {
      this.value = this.value.replace(/[^\d]/g, '');
    });
    document.getElementById('maxPrice').addEventListener('input', function () {
      this.value = this.value.replace(/[^\d]/g, '');
    });

    document.getElementById('continueBtn').addEventListener('click', async function() {
      // Validate city
      const city = document.querySelector('select[name="city"]').value;
      if (!city) {
        alert('Please select a city.');
        return;
      }
      // Validate area
      const area = document.querySelector('select[name="area"]').value;
      if (!area) {
        alert('Please select an area.');
        return;
      }
      // Validate contract
      const contract = document.querySelector('select[name="contract"]').value;
      if (!contract) {
        alert('Please select a contract type.');
        return;
      }
      // Validate at least one feature
      const features = document.querySelectorAll('.feature-btn.selected-feature');
      if (features.length === 0) {
        alert('Please select at least one feature.');
        return;
      }
      // Validate room selection
      const rooms = document.querySelectorAll('.room-btn.selected-room');
      if (rooms.length === 0) {
        alert('Please select the number of rooms.');
        return;
      }
      // Validate price
      const minPrice = document.getElementById('minPrice').value.trim();
      const maxPrice = document.getElementById('maxPrice').value.trim();
      if (!minPrice || !maxPrice || isNaN(minPrice) || isNaN(maxPrice) || Number(minPrice) > Number(maxPrice)) {
        alert('Please enter a valid price range.');
        return;
      }
      // Validate date
      const date = document.querySelector('input[type="date"]').value;
      if (!date) {
        alert('Please select a date of entry.');
        return;
      }
      // Remove emojis from features and rooms
      function stripEmojis(str) {
        return str.replace(/^[^a-zA-Z0-9]+/, '').trim();
      }
      const featuresArray = Array.from(features).map(f => stripEmojis(f.textContent));
      const numRoomsArray = Array.from(rooms).map(r => stripEmojis(r.textContent));
      // Save to Supabase
      const userId = parseInt(localStorage.getItem('user_id'));
      const { error } = await supabaseClient
        .from('user_apartment_search_preferences')
        .insert([{
          id: userId,
          user_id: userId,
          preferred_city: city,
          preferred_area: area,
          preferred_contract_type: contract,
          preferred_features: featuresArray,
          preferred_num_rooms: numRoomsArray,
          preferred_price_min: minPrice ? parseInt(minPrice) : null,
          preferred_price_max: maxPrice ? parseInt(maxPrice) : null,
          preferred_date_of_entry: date
        }]);
      if (error) {
        alert('Error saving preferences: ' + error.message);
        return;
      }
      // If all valid, show popup and continue
      const popup = document.getElementById('successPopup');
      popup.classList.remove('hidden');
      setTimeout(() => {
        popup.classList.add('hidden');
        window.location.href = 'apt-feed.html';
      }, 2000);
    });

    // Set date input to today and prevent past dates
    window.addEventListener('DOMContentLoaded', function() {
      const dateInput = document.getElementById('entryDate');
      if (dateInput) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        dateInput.value = todayStr;
        dateInput.min = todayStr;
      }
    });
  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apartment Details</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=101827&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    html, body {
      height: 100%;
      min-height: 100vh;
      background: #F2F4F5;
      font-family: '101827', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    body {
      width: 100vw;
      min-height: 100vh;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      overflow-y: auto;
    }
    .close-btn {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      background: white;
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 0.5rem 0.7rem;
      z-index: 20;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: #f3e8ff;
    }
    .accent { color: #764C8A; }
    .bg-accent { background: #764C8A; }
    .border-accent { border-color: #764C8A; }
    .content-wrapper {
      width: 100%;
      max-width: 1200px;
      margin: 6rem auto;
      padding: 0 3rem;
      display: flex;
      gap: 6rem;
      justify-content: center;
    }
    .left-column {
      width: 40%;
      position: sticky;
      top: 3rem;
      height: fit-content;
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }
    .right-column {
      width: 60%;
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }
    .section {
      background: white;
      border-radius: 2rem;
      padding: 4rem 3rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
      margin-bottom: 4rem;
    }
    .header-img {
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 3000px;
      margin-left: 0;
      margin-right: auto;
      margin-bottom: 2rem;
      height: 420px;
      display: flex;
      align-items: left;
      justify-content: center;
    }
    .header-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2rem;
      display: block;
    }
    .location-title {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 2.5rem;
      line-height: 1.4;
    }
    .features {
      font-size: 1.3rem;
      margin-bottom: 3rem;
      line-height: 1.5;
    }
    .section-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      margin-top: 3rem;
      line-height: 1.4;
    }
    .description {
      font-size: 1.2rem;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }
    .amenities {
      font-size: 1.2rem;
      margin-bottom: 3rem;
      line-height: 1.5;
    }
    .photos {
      margin-bottom: 3rem;
    }
    .roommate-info .name {
      font-size: 1.4rem;
      font-weight: bold;
      line-height: 1.3;
    }
    .roommate-info .role {
      font-size: 1.1rem;
      line-height: 1.3;
    }
    .bg-purple-50 {
      background: #f6f3fa;
    }
    .mb-1 { margin-bottom: 1.5rem; }
    .mb-2 { margin-bottom: 2.2rem; }
    .mb-4 { margin-bottom: 3rem; }
    .mb-6 { margin-bottom: 4rem; }
    .py-8 { padding-top: 4rem; padding-bottom: 4rem; }
    .text-lg { font-size: 2rem; }
    .text-xl { font-size: 2.5rem; }
    .text-xs { font-size: 1.3rem; }
    .text-sm { font-size: 1.5rem; }
    .font-bold { font-weight: bold; }
    .roommate-info, .uploaderHtml, .content, .text-sm, .text-xs, .text-lg, .text-xl {
      font-size: 1.1rem !important;
    }
    .uploaderHtml {
      font-size: 1.3rem;
      line-height: 1.5;
    }
    .bio, .email, .text-sm, .text-xs {
      font-size: 1.15rem !important;
      line-height: 1.6 !important;
    }
    .content, .text-lg, .text-xl {
      font-size: 1.3rem !important;
      line-height: 1.6 !important;
    }
    #aptImages.section {
      background: none;
      box-shadow: none;
      padding: 0;
    }
    @media (max-width: 768px) {
      .content-wrapper {
        flex-direction: column;
        padding: 0 1rem;
        margin: 3rem auto;
        gap: 3rem;
      }
      .left-column, .right-column {
        width: 100%;
      }
      .left-column {
        position: relative;
        top: 0;
      }
      .section {
        padding: 2rem 0.7rem;
      }
      .location-title {
        font-size: 1.8rem;
      }
      .features {
        font-size: 1.2rem;
      }
      .section-title {
        font-size: 1.3rem;
      }
      .description {
        font-size: 1.1rem;
      }
      .amenities {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main style="min-height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;">
    <a href="apt-feed.html" class="close-btn" title="Back to feed">
      <i class="fas fa-times text-gray-700 text-xl"></i>
    </a>
    <div class="content-wrapper">
      <!-- Left Column -->
      <div class="left-column">
        <div id="aptImages" class="section"></div>
        <button id="scheduleBtn" class="chat-btn w-full bg-accent hover:bg-purple-900 text-white py-3 rounded-xl text-lg font-semibold shadow">SCHEDULE WITH</button>
      </div>
      
      <!-- Right Column -->
      <div class="right-column">
        <div id="loading" class="text-center text-gray-400 py-8 text-lg">Loading apartment details...</div>
        <div class="content" id="aptContent" style="display:none;"></div>
        <div id="scheduleModal" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50 hidden">
          <div class="bg-white rounded-2xl p-6 shadow-lg w-80 relative">
            <button id="closeModal" class="absolute top-2 right-2 text-gray-400 hover:text-purple-700 text-xl">&times;</button>
            <div class="font-bold text-lg mb-2">Schedule a meeting</div>
            <label class="block mb-2 text-sm font-medium">Pick a date and time:</label>
            <input id="meetingDateTime" type="datetime-local" class="w-full border border-purple-200 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-300" />
            <button id="addToGoogleCal" class="w-full bg-accent hover:bg-purple-900 text-white py-2 rounded-lg font-semibold">Add to Google Calendar</button>
          </div>
        </div>
        <!-- Future: Google Maps location here -->
        <div id="map" style="width:100%;height:220px;margin-top:2rem;display:none;"></div>
      </div>
    </div>
  </main>
  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
    const SUPABASE_URL = 'https://vgkvkmpckneceqfggzes.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZna3ZrbXBja25lY2VxZmdnemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDA0NjAsImV4cCI6MjA2MjExNjQ2MH0.1ZEMsUleNaBrePUuagdZAKL2gYA-9-vM9wrTIW8-tdU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    async function fetchAndRenderApartment() {
      const aptId = getQueryParam('id');
      if (!aptId) {
        window.location.href = 'apt-feed.html';
        return;
      }
      document.getElementById('loading').style.display = '';
      document.getElementById('aptContent').style.display = 'none';
      const { data: apartmentData, error } = await supabaseClient
        .from('apartments')
        .select('*')
        .eq('id', aptId)
        .single();
      if (error || !apartmentData) {
        document.getElementById('loading').innerHTML = '<div class="text-red-500">Apartment not found.</div>';
        return;
      }
      // QA: Apartment data loaded
      // Images
      const images = Array.isArray(apartmentData.image_urls) ? apartmentData.image_urls : [];
      let imagesHtml = '';
      if (images.length > 0) {
        imagesHtml = images.map((img, i) => `
          <div class="header-img rounded-2xl overflow-hidden mb-4 relative">
            <img src="${img}" alt="Apartment" class="w-full h-48 object-cover rounded-2xl" />
            <div class="price-bubble absolute bottom-4 left-4 bg-accent text-white px-4 py-2 rounded-full font-bold shadow">${apartmentData.price_per_month ? '₪' + apartmentData.price_per_month + ' / mo' : ''}</div>
          </div>
        `).join('');
      }
      document.getElementById('aptImages').innerHTML = imagesHtml;
      // Features
      const features = [];
      if (apartmentData.size) features.push({ icon: 'fa-ruler-combined', label: apartmentData.size });
      if (apartmentData.num_bathrooms) features.push({ icon: 'fa-bath', label: apartmentData.num_bathrooms + ' baths' });
      if (apartmentData.num_rooms) features.push({ icon: 'fa-bed', label: apartmentData.num_rooms + ' rooms' });
      // Amenities
      let amenities = [];
      if (Array.isArray(apartmentData.amenities)) {
        amenities = apartmentData.amenities.map(a => ({ icon: a.icon || 'fa-check', label: a.label || a }));
      }
      // Roommate
      let roommate = null;
      if (Array.isArray(apartmentData.roommate) && apartmentData.roommate.length > 0) {
        roommate = apartmentData.roommate[0];
      }
      // Fetch uploader (user) by roommate_id
      let uploader = null;
      if (apartmentData.roommate_id) {
        const { data: userData, error: userError } = await supabaseClient
          .from('users')
          .select('full_name, age, gender, profile_image_url, bio, email')
          .eq('id', apartmentData.roommate_id)
          .single();
        if (!userError && userData) {
          uploader = userData;
        }
      }
      // Render
      let uploaderHtml = '';
      if (uploader) {
        uploaderHtml = `
        <div class="section-title font-bold mb-1">Listed by</div>
        <div class="flex items-center gap-4 mb-4">
          <img src="${uploader.profile_image_url || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" alt="Uploader" class="w-24 h-24 rounded-full object-cover border-2 border-purple-200" />
          <div>
            <div class="font-bold accent text-lg">${uploader.full_name || ''}${uploader.age ? ', ' + uploader.age : ''}</div>
            <div class="text-xs text-gray-600">${uploader.gender || ''}</div>
            <div class="text-xs text-gray-600">${uploader.email || ''}</div>
            <div class="text-sm text-gray-800">${uploader.bio || ''}</div>
          </div>
        </div>
        `;
      }
      document.getElementById('aptContent').innerHTML = `
        <div class="location-title text-xl font-bold mb-2 accent">${apartmentData.address || 'Apartment Details'}</div>
        <div class="features flex gap-6 text-gray-700 mb-4">
          ${features.map(f => `<div class='flex items-center gap-1'><i class='fas ${f.icon}'></i> ${f.label}</div>`).join('')}
        </div>
        <div class="section-title font-bold mb-1">Room description</div>
        <div class="description text-sm mb-4">${apartmentData.description || 'No description available.'}</div>
        ${amenities.length > 0 ? `
        <div class="section-title font-bold mb-1">Amenities</div>
        <div class="amenities flex gap-8 justify-start mb-6">
          ${amenities.map(a => `<div class='flex flex-col items-center accent'><i class='fas ${a.icon} fa-2x mb-1'></i><span class='text-xs'>${a.label}</span></div>`).join('')}
        </div>` : ''}
        ${images.length > 1 ? `
        <div class="section-title font-bold mb-1">More photos</div>
        <div class="photos flex gap-3 mb-6">
          ${images.slice(1).map(p => `<img src='${p}' alt='photo' class='w-20 h-20 rounded-lg object-cover'/>`).join('')}
        </div>` : ''}
        ${roommate ? `
        <div class="section-title font-bold mb-1">About roommate</div>
        <div class="bg-purple-50 border border-purple-200 rounded-xl flex items-center gap-4 p-4 mb-4">
          <img src="${roommate.img || 'https://randomuser.me/api/portraits/men/75.jpg'}" alt="${roommate.name || ''}" class="w-14 h-14 rounded-full object-cover border-2 border-purple-200" />
          <div class="roommate-info">
            <div class="name font-bold accent text-lg">${roommate.name || ''}${roommate.age ? ', ' + roommate.age : ''}</div>
            <div class="role text-xs text-gray-600">${roommate.role || ''}</div>
          </div>
        </div>
        <div class="description text-sm mb-6">${roommate.about || ''}</div>
        ` : ''}
        ${uploaderHtml}
      `;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('aptContent').style.display = '';
    }
    fetchAndRenderApartment();
    // --- Schedule Modal Logic ---
    const scheduleBtn = document.getElementById('scheduleBtn');
    const scheduleModal = document.getElementById('scheduleModal');
    const closeModal = document.getElementById('closeModal');
    const addToGoogleCal = document.getElementById('addToGoogleCal');
    const meetingDateTime = document.getElementById('meetingDateTime');
    scheduleBtn.addEventListener('click', () => {
      scheduleModal.classList.remove('hidden');
    });
    closeModal.addEventListener('click', () => {
      scheduleModal.classList.add('hidden');
    });
    scheduleModal.addEventListener('click', (e) => {
      if (e.target === scheduleModal) scheduleModal.classList.add('hidden');
    });
    addToGoogleCal.addEventListener('click', () => {
      const dt = meetingDateTime.value;
      if (!dt) {
        alert('Please select a date and time.');
        return;
      }
      // Format date/time for Google Calendar (YYYYMMDDTHHMMSSZ)
      const start = new Date(dt);
      const end = new Date(start.getTime() + 60 * 60 * 1000); // 1 hour meeting
      function toGCalFormat(date) {
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      }
      // Use address as location
      const aptAddress = document.querySelector('.location-title')?.textContent || '';
      const title = encodeURIComponent(`Meeting at ${aptAddress}`);
      const details = encodeURIComponent(`Apartment: ${aptAddress}`);
      const location = encodeURIComponent(aptAddress);
      const startStr = toGCalFormat(start);
      const endStr = toGCalFormat(end);
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startStr}/${endStr}&details=${details}&location=${location}`;
      window.open(url, '_blank');
      scheduleModal.classList.add('hidden');
    });
  </script>
</body>
</html>
